<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COO Prep</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="COO Prep">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F5F5F2; --surf:#FFFFFF; --surf2:#FAFAF7; --line:#E8E8E2;
  --ink:#14171C; --ink2:#5C636C; --ink3:#9198A2;
  --ok:#0A8F5F; --okbg:#E9F7F0; --okline:#BFE7D5;
  --no:#D0281F; --nobg:#FDECEA; --noline:#F4C9C4;
  --warn:#8F5606; --warnbg:#FDF3E3; --warnline:#F0DAB4;
  --hero:#15181E; --heroink:#FFFFFF;
  --sh:0 1px 2px rgba(18,22,28,.05), 0 10px 26px -14px rgba(18,22,28,.22);
  --r:16px; --rl:20px;
}
html[data-theme="dark"]{
  --bg:#0B0D11; --surf:#15181E; --surf2:#1B1F26; --line:#272C35;
  --ink:#EFF2F6; --ink2:#A4ACB7; --ink3:#78818D;
  --ok:#3ED598; --okbg:#0E2C24; --okline:#1F5040;
  --no:#F8776F; --nobg:#33161A; --noline:#52262A;
  --warn:#EFB851; --warnbg:#332610; --warnline:#4C3B1B;
  --hero:#20262F; --heroink:#FFFFFF;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -18px rgba(0,0,0,.85);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100dvh}
#head{flex:0 0 auto;display:none;padding:calc(env(safe-area-inset-top) + 6px) 16px 10px;background:var(--bg)}
#head.on{display:block}
#body{flex:1 1 auto;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:6px 16px calc(26px + env(safe-area-inset-bottom))}
.wrap.mid{margin:auto}
.anim{animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* ---------- head ---------- */
.hrow{display:flex;align-items:center;gap:10px;min-height:36px}
.hrow .ht{flex:1;min-width:0;font-size:15px;font-weight:750;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hc{flex:0 0 auto;font-size:13px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.ico{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit}
.ico:active{transform:scale(.93);background:var(--surf2)}
.timer{font:750 12.5px/1 ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  padding:8px 10px;border-radius:99px;background:var(--surf);border:1px solid var(--line);color:var(--ink2)}
.timer.over{color:var(--warn);background:var(--warnbg);border-color:var(--warnline)}
.timer.crit{color:var(--no);background:var(--nobg);border-color:var(--noline)}
.track{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;background:var(--a,var(--ink));transition:width .35s cubic-bezier(.2,.8,.3,1)}
.headtrack{margin-top:10px}

/* ---------- home ---------- */
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 18px}
.brand{font-size:28px;font-weight:820;letter-spacing:-.7px;line-height:1.1}
.brand-s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.streak{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid var(--line);background:var(--surf);border-radius:13px;padding:7px 12px 6px}
.streak b{font-size:18px;font-weight:820;line-height:1;font-variant-numeric:tabular-nums}
.streak span{font-size:10px;color:var(--ink3);font-weight:600}
.hero{display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  border:none;border-radius:var(--rl);padding:17px 18px 16px;background:var(--hero);color:var(--heroink);box-shadow:var(--sh)}
.hero:active{transform:scale(.985)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .k{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.6}
.hero .n{font-size:11.5px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.hero-t{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:11px 0 3px}
.hero-s{font-size:12.5px;opacity:.62}
.hero-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:14px}
.hero-bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s cubic-bezier(.2,.8,.3,1)}
.rev{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:13px 15px;cursor:pointer;
  border:1px solid var(--noline);background:var(--nobg);border-radius:var(--r);color:var(--ink);
  font:650 14.5px/1.3 inherit;text-align:left}
.rev:active{transform:scale(.985)}
.rdot{width:8px;height:8px;border-radius:99px;background:var(--no);flex:0 0 auto}
.rev b{margin-left:auto;font-weight:820;color:var(--no);font-variant-numeric:tabular-nums}
.stats{display:flex;margin-top:16px;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);overflow:hidden}
.stats>div{flex:1;padding:13px 6px;text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:none}
.stats b{display:block;font-size:22px;font-weight:820;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.stats b.r{color:var(--no)}
.stats span{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:4px}
.mod{margin-top:24px}
.mod-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mod-dot{width:9px;height:9px;border-radius:3px;background:var(--a);flex:0 0 auto}
.mod-t{font-size:11.5px;font-weight:820;letter-spacing:1px;text-transform:uppercase;color:var(--ink2)}
.mod-c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{position:relative;display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:12px 12px 13px;box-shadow:var(--sh)}
.tile:active{transform:scale(.975)}
.tile .num{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:30px;padding:0 7px;
  border-radius:7px;background:var(--at);color:var(--a);font-size:11px;font-weight:820;font-variant-numeric:tabular-nums}
.tile .st{position:absolute;top:11px;right:11px;font-size:11px;font-weight:820;color:var(--no);font-variant-numeric:tabular-nums}
.tile .st.ok{color:var(--ok)}
.tile .nm{display:block;font-size:13px;font-weight:650;line-height:1.32;margin:9px 0 7px;min-height:33px;color:var(--ink)}
.tile .cnt{display:block;font-size:11px;font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums}
.footrow{display:flex;gap:8px;margin-top:26px}
.footrow button{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:transparent;
  color:var(--ink2);font:650 12.5px/1 inherit;cursor:pointer}
.footrow button:active{background:var(--surf2)}
.foot{text-align:center;font-size:11px;color:var(--ink3);padding:16px 0 4px}

/* ---------- accordion ---------- */
.acc{margin-top:18px;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;font-size:14px;font-weight:700}
.acc>.ah:active{background:var(--surf2)}
.acc>.ah .chev{margin-left:auto;color:var(--ink3);font-size:16px;transition:transform .2s}
.acc.open>.ah .chev{transform:rotate(90deg)}
.acc>.ab{display:none;padding:2px 15px 16px;border-top:1px solid var(--line)}
.acc.open>.ab{display:block}

/* ---------- type ---------- */
.thero{border-radius:var(--rl);padding:16px 17px;background:var(--at);border:1px solid var(--a);margin-bottom:12px}
.thero .num{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;
  background:var(--a);color:#fff;font-size:11.5px;font-weight:820}
.thero h2{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:10px 0 4px;color:var(--ink)}
.thero .sub{font-size:12.5px;color:var(--ink2);font-weight:600}
.thero .track{margin-top:13px}
.cta{display:block;width:100%;padding:17px;border-radius:15px;border:none;font:800 16px/1.2 inherit;cursor:pointer;
  background:var(--a);color:#fff;letter-spacing:.1px}
.cta:active{transform:scale(.985)}
.cta.ghost{background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:700;margin-top:9px}
.cta.ghost:active{background:var(--surf2)}
.sh{font-size:11px;font-weight:820;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin:18px 0 9px}
.sp{font-size:14px;line-height:1.6;color:var(--ink2)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding-left:32px;margin-bottom:10px;font-size:14px;line-height:1.55;color:var(--ink)}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;
  width:21px;height:21px;border-radius:7px;background:var(--at);color:var(--a);
  font-size:11px;font-weight:820;display:flex;align-items:center;justify-content:center}
.fml{font:650 13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surf2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;color:var(--ink);
  overflow-x:auto;white-space:nowrap}
.exbox{background:var(--surf2);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:0 11px 11px 0;padding:12px 13px}
.exbox ol{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.exbox ol li{margin-bottom:5px}
.warns{margin:0;padding:0;list-style:none}
.warns li{position:relative;padding-left:18px;margin-bottom:8px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.warns li:before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:99px;background:var(--warn)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.chip{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);
  font:700 13px/1 inherit;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.chip:active{transform:scale(.95)}
.chip.ok{color:var(--ok);border-color:var(--okline);background:var(--okbg)}
.chip.bad{color:var(--no);border-color:var(--noline);background:var(--nobg)}
.chip.mas{background:var(--ok);border-color:transparent;color:#fff}

/* ---------- practice ---------- */
.pr{width:100%;max-width:600px;margin:auto;padding:4px 16px calc(170px + env(safe-area-inset-bottom))}
.ptag{display:inline-block;font-size:10.5px;font-weight:820;letter-spacing:.9px;text-transform:uppercase;
  color:var(--a);background:var(--at);padding:5px 10px;border-radius:8px}
.pq{font-size:20px;font-weight:700;line-height:1.42;letter-spacing:-.3px;margin:13px 0 20px;white-space:pre-wrap}
.answer{display:flex;gap:10px;align-items:stretch}
.answer input{flex:1;min-width:0;width:100%;font:750 24px/1 inherit;font-variant-numeric:tabular-nums;
  padding:17px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink)}
.answer input:focus{outline:none;border-color:var(--a)}
.answer input.err{border-color:var(--no)}
.answer .u{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:56px;padding:0 15px;
  border-radius:14px;border:2px solid var(--line);background:var(--surf2);font-size:15px;font-weight:750;color:var(--ink2)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.45;
  padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);
  margin-bottom:9px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt .l{flex:0 0 auto;width:27px;height:27px;border-radius:9px;background:var(--surf2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:820;color:var(--ink2)}
.opt.sel{border-color:var(--a);background:var(--at)}
.opt.sel .l{background:var(--a);color:#fff;border-color:transparent}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .l{background:var(--ok);color:#fff;border-color:transparent}
.opt.bad{border-color:var(--no);background:var(--nobg)}
.opt.bad .l{background:var(--no);color:#fff;border-color:transparent}
.opt.off{opacity:.45}
textarea.q{width:100%;min-height:132px;font:inherit;font-size:15px;line-height:1.5;padding:14px;
  border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);resize:vertical}
textarea.q:focus{outline:none;border-color:var(--a)}
.btn{display:block;width:100%;padding:17px;border-radius:15px;border:none;font:800 16px/1.2 inherit;cursor:pointer;letter-spacing:.1px}
.btn.go{background:var(--a);color:#fff;box-shadow:0 8px 20px -12px var(--a)}
.btn.go:active{transform:scale(.985)}
.btn.plain{background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.plain:active{background:var(--surf2)}
.btn.quiet{background:transparent;color:var(--ink2);font-weight:700;padding:14px}
.mt{margin-top:11px}
.fb{border-radius:16px;padding:15px;border:1.5px solid var(--line);animation:pop .2s ease both}
.fb.ok{background:var(--okbg);border-color:var(--okline)}
.fb.no{background:var(--nobg);border-color:var(--noline)}
.fb.ref{background:var(--surf2);border-color:var(--a)}
.fb .v{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:820;margin-bottom:11px}
.fb.ok .v{color:var(--ok)}
.fb.no .v{color:var(--no)}
.fb.ref .v{color:var(--a)}
.fb .mk{width:22px;height:22px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;flex:0 0 auto}
.fb.ok .mk{background:var(--ok)}
.fb.no .mk{background:var(--no)}
.fb.ref .mk{background:var(--a)}
.fb .kv{font:820 22px/1.25 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);letter-spacing:-.4px}
.fb .mine{font-size:13.5px;color:var(--ink2);margin-top:5px}
.fb .mine b{color:var(--ink)}
.fb .lbl{font-size:10.5px;font-weight:820;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin:15px 0 7px}
.fb ol,.fb ul{margin:0;padding-left:19px;font-size:14px;line-height:1.55;color:var(--ink2)}
.fb ol li,.fb ul li{margin-bottom:6px}
.fb .tip{background:var(--warnbg);border:1px solid var(--warnline);border-radius:11px;padding:11px 12px;
  font-size:13.5px;line-height:1.5;color:var(--warn)}
.hintbtn{background:none;border:none;font:650 13.5px/1 inherit;color:var(--ink3);padding:14px 0 0;cursor:pointer}
.hintbox{font-size:13.5px;line-height:1.5;color:var(--ink2);background:var(--surf2);
  border-left:3px solid var(--a);border-radius:0 10px 10px 0;padding:11px 12px;margin-top:14px}

/* ---------- summary ---------- */
.sum{text-align:center;padding-top:8px}
.ringwrap{display:inline-flex;position:relative;margin:6px 0 4px}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:40px;font-weight:830;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.ringtxt span{font-size:11px;color:var(--ink3);font-weight:600;margin-top:3px}
.sumline{font-size:14px;color:var(--ink2);margin-bottom:20px}
.sumline b{color:var(--ink);font-weight:750}
.wlist{margin-top:8px;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);overflow:hidden;text-align:left}
.wi{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.wi:last-child{border-bottom:none}
.wi .wig{flex:0 0 auto;font-size:10.5px;font-weight:820;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.wi .wt{flex:1;min-width:0;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi:active{background:var(--surf2)}
</style>
</head>
<body>
<div id="app">
  <div id="head"></div>
  <div id="body"></div>
</div>
<script src="bank.js"></script>
<script>
(function(){
"use strict";
var BANK=window.BANK;
if(!BANK){document.getElementById('body').innerHTML='<p style="padding:40px;text-align:center">bank.js не загрузился</p>';return;}

/* ---------- storage ---------- */
var LS='cooprep.v1';
var ST={q:{},theory:{},days:[],today:null,theme:'light'};
(function(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);
  ST.q=o.q||{};ST.theory=o.theory||{};ST.days=o.days||[];ST.today=o.today||null;ST.theme=o.theme||'light';}}catch(e){}})();
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
var THEME=ST.theme;
document.documentElement.setAttribute('data-theme',THEME);

/* ---------- index ---------- */
var TYPES=[],TBY={};
BANK.modules.forEach(function(m){m.types.forEach(function(t){t._m=m;TBY[t.id]=t;TYPES.push(t);
  t.qs.forEach(function(q,i){q._t=t;q._i=i;});});});
var TOTALQ=0,ALLQ=[];
TYPES.forEach(function(t){TOTALQ+=t.qs.length;t.qs.forEach(function(q){ALLQ.push(q);});});

/* ---------- theme colors ---------- */
var LC={m:'#0E9F6E',p:'#2F6FED',b:'#C2740A',l:'#6D28D9',c:'#C81E6E',j:'#4D7C0F',f:'#DC5B12'};
function mcol(m){return THEME==='light'?(LC[m.id]||'#14171C'):m.color;}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function tint(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function accentStyle(m,extra){return '--a:'+mcol(m)+';--at:'+tint(mcol(m),THEME==='light'?.11:.16)+';'+(extra||'');}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){if(v===null||v===undefined||isNaN(v))return '—';
  var neg=v<0;v=Math.abs(v);var s;
  s=Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):String(Math.round(v*1000)/1000);
  var p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
  return (neg?'\u2212':'')+p.join(',');}
function fmtMs(ms){var s=Math.max(0,Math.round(ms/1000));var m=Math.floor(s/60);var r=s%60;
  return m+':'+(r<10?'0':'')+r;}
function parseNum(raw){
  if(raw===null||raw===undefined)return null;
  var s=String(raw).trim().toLowerCase();
  if(!s)return null;
  s=s.replace(/\u00a0/g,' ').replace(/\s+/g,'');
  var mult=1;
  if(/(млрд|bn)$/.test(s)){mult=1e9;s=s.replace(/(млрд|bn)$/,'');}
  else if(/(млн|kk|mm|m)$/.test(s)){mult=1e6;s=s.replace(/(млн|kk|mm|m)$/,'');}
  else if(/(тыс|k)$/.test(s)){mult=1e3;s=s.replace(/(тыс|k)$/,'');}
  s=s.replace(/[\u20bd$\u20ac\u00a3%]/g,'');
  if(!/^[0-9.,+\-]+$/.test(s))return null;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)){s=s.replace(/,/g,'');}
  else{s=s.replace(/,/g,'.');}
  var v=parseFloat(s);
  if(isNaN(v))return null;
  return v*mult;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ring(pct,color,size){
  var sw=size/13, r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/>'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
   +'</svg>';
}

/* ---------- stats ---------- */
function isOk(q){var s=ST.q[q.id];return !!(s&&s.s==='ok');}
function isMas(q){var s=ST.q[q.id];return !!(s&&s.s==='ok'&&s.first);}
function isBad(q){var s=ST.q[q.id];return !!(s&&s.s==='bad');}
function tStat(t){var o=0,m=0,b=0;t.qs.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q)){b++;}});
  return{ok:o,m:m,bad:b,total:t.qs.length};}
function gStat(){var o=0,m=0,b=0;ALLQ.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q)){b++;}});
  return{ok:o,m:m,bad:b,total:TOTALQ};}
function badList(){return ALLQ.filter(isBad);}
function dayKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayN(){var k=dayKey(new Date());return (ST.today&&ST.today.d===k)?(ST.today.n||0):0;}
function bumpToday(){var k=dayKey(new Date());
  if(!ST.today||ST.today.d!==k)ST.today={d:k,n:0};
  ST.today.n++;save();}
function record(q,ok,ms){
  var s=ST.q[q.id]||{tries:0};
  s.tries=(s.tries||0)+1;
  if(s.first===undefined||s.first===null)s.first=!!ok;
  s.s=ok?'ok':'bad';s.ms=ms||0;s.ts=Date.now();
  ST.q[q.id]=s;bumpToday();save();
}
function markDay(){var k=dayKey(new Date());if(ST.days.indexOf(k)<0){ST.days.push(k);save();}}
function streak(){var set={};ST.days.forEach(function(d){set[d]=1;});
  var n=0,d=new Date();while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function checkNum(q,raw){
  var v=parseNum(raw);
  if(v===null)return{invalid:true};
  var cand=[q.a].concat(q.alt||[]);
  var tol=(q.tol!==undefined&&q.tol!==null)?q.tol:Math.max(Math.abs(q.a)*0.005,0.005);
  for(var i=0;i<cand.length;i++){if(Math.abs(v-cand[i])<=tol)return{ok:true,v:v};}
  return{ok:false,v:v};
}

/* ---------- actions ---------- */
window.A={
  home:function(){screen='home';S=null;render();},
  open:function(id){typeId=id;screen='type';accTheory=!ST.theory[id];S=null;render();},
  theory:function(){accTheory=!accTheory;if(accTheory&&typeId){ST.theory[typeId]=1;save();}render();},
  proto:function(){accProto=!accProto;render();},
  theme:function(){THEME=(THEME==='light')?'dark':'light';ST.theme=THEME;save();
    document.documentElement.setAttribute('data-theme',THEME);
    var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',THEME==='light'?'#F5F5F2':'#0B0D11');
    render();},
  reset:function(){if(confirm('Сбросить весь прогресс?')){ST={q:{},theory:{},days:[],today:null,theme:THEME};save();render();}},
  start:function(id){var t=TBY[id];A.run(t.qs.map(function(q,i){return{tid:id,qi:i};}),'type');},
  startShuffle:function(id){var t=TBY[id];A.run(shuffle(t.qs.map(function(q,i){return{tid:id,qi:i};})),'type');},
  startBad:function(id){var t=TBY[id];
    A.run(t.qs.map(function(q,i){return{tid:id,qi:i};}).filter(function(x){return isBad(t.qs[x.qi]);}),'type');},
  jump:function(id,i){var t=TBY[id];A.run(t.qs.map(function(q,j){return{tid:id,qi:j};}),'type',i);},
  run:function(list,mode,startAt){
    if(!list.length)return;
    S={list:list,idx:startAt||0,mode:mode,answered:false,ok:null,user:'',pick:null,val:'',hint:false,revealed:false,
       done:0,correct:0,wrong:[],startedAt:Date.now(),taskStart:Date.now(),endedAt:null,
       deadline:(mode==='drill')?Date.now()+20*60*1000:null};
    screen='practice';render();
  },
  retry:function(){var b=badList();if(!b.length)return;
    A.run(shuffle(b.map(function(q){return{tid:q._t.id,qi:q._i};})),'type');},
  redoWrong:function(){if(!S||!S.wrong.length)return;var l=[];
    S.wrong.forEach(function(id){ALLQ.forEach(function(q){if(q.id===id)l.push({tid:q._t.id,qi:q._i});});});
    A.run(l,'type');},
  drill:function(){
    var pool=ALLQ.slice();
    shuffle(pool);
    function pri(q){var s=ST.q[q.id];if(!s)return 1;return s.s==='bad'?0:2;}
    pool.sort(function(a,b){return pri(a)-pri(b);});
    var pick=[],cnt={};
    for(var lim=1;lim<=4&&pick.length<DAILY;lim++){
      for(var i=0;i<pool.length&&pick.length<DAILY;i++){
        var q=pool[i];if(pick.indexOf(q)>=0)continue;
        var tid=q._t.id;if((cnt[tid]||0)>=lim)continue;
        pick.push(q);cnt[tid]=(cnt[tid]||0)+1;
      }
    }
    if(!pick.length)return;
    A.run(pick.map(function(q){return{tid:q._t.id,qi:q._i};}),'drill');
  },
  leave:function(){S=null;screen=typeId?'type':'home';render();},
  hint:function(){if(!S)return;var el=document.getElementById('ans');
    if(el&&el.value!==undefined)S.val=el.value;S.hint=true;render();},
  reveal:function(){var el=document.getElementById('ans');if(el&&S)S.val=el.value;if(S)S.revealed=true;render();},
  pick:function(i){if(!S)return;S.pick=i;render();},
  check:function(){
    var c=cur();if(!c||S.answered)return;
    if(c.q.kind==='num'){
      var el=document.getElementById('ans'),raw=el?el.value:'',r=checkNum(c.q,raw);
      if(r.invalid){if(el){el.classList.add('err');el.focus();}return;}
      A.finish(!!r.ok,raw);
    } else if(c.q.kind==='mc'){
      if(S.pick===null||S.pick===undefined)return;
      A.finish(S.pick===c.q.correct,String.fromCharCode(65+S.pick)+'. '+c.q.opts[S.pick]);
    }
  },
  selfGood:function(){A.finish(true,S.val);},
  selfBad:function(){A.finish(false,S.val);},
  finish:function(ok,user){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=ok;S.user=user||'';
    record(c.q,ok,Date.now()-S.taskStart);
    S.done++;if(ok)S.correct++;else S.wrong.push(c.q.id);
    render();
  },
  next:function(){
    if(!S)return;
    if(S.idx+1>=S.list.length){S.endedAt=Date.now();screen='summary';markDay();render();return;}
    S.idx++;S.answered=false;S.ok=null;S.user='';S.pick=null;S.val='';S.hint=false;S.revealed=false;S.taskStart=Date.now();
    render();
  }
};

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||screen!=='practice'||!S)return;
  var c=cur();if(!c)return;
  if(!S.answered){if(c.q.kind==='num'){e.preventDefault();A.check();}}
  else{e.preventDefault();A.next();}
});

setInterval(function(){
  if(screen!=='practice'||!S)return;
  var el=document.getElementById('timer');if(!el)return;
  var c=cur();if(!c)return;
  if(S.deadline){
    var left=S.deadline-Date.now();
    el.textContent=fmtMs(left);
    el.className='timer'+(left<60000?' crit':left<300000?' over':'');
    if(left<=0){S.endedAt=Date.now();screen='summary';markDay();render();}
  } else {
    var t=Date.now()-S.taskStart;
    el.textContent=fmtMs(t);
    var target=(c.t.targetSec||90)*1000;
    el.className='timer'+(t>target*2?' crit':t>target?' over':'');
  }
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});
}
render();
})();
</script>
</body>
</html>
