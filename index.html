function skillLabel(q){return q.skillTitle||SKILL_NAMES[q.skill]||(q._t?'приём из темы «'+q._t.title+'»':'этот приём');}
var SKILL_GUIDES={
  m0_ten_percent:{title:'Найти 10% в уме',plain:'10% — это одна десятая от всего числа. Представь, что число разделили на десять одинаковых кучек: размер одной кучки и есть 10%.',steps:['Посмотри на всё число.','Раздели его на 10: для круглых чисел просто сдвинь запятую на один шаг влево.','Проверь: если сложить десять таких частей, получится исходное число.'],example:'10% от 360: 360 / 10 = 36.'},
  m0_half:{title:'Найти половину',plain:'Половина получается, когда целое делят на две равные части. Для удобства можно делить десятки и единицы отдельно.',steps:['Разбей число на удобные части.','Раздели каждую часть пополам.','Сложи результаты и проверь удвоением.'],example:'Половина от 86: половина 80 — 40; половина 6 — 3; вместе 43.'},
  m0_one_percent:{title:'Найти 1%',plain:'1% — одна часть из ста одинаковых частей. Чтобы найти её, раздели число на 100.',steps:['Сначала найди целое число.','Раздели его на 100.','Проверь: 100 таких маленьких частей должны составить исходное число.'],example:'1% от 700: 700 / 100 = 7.'},
  m0_five_percent:{title:'Найти 5%',plain:'5% — это половина от 10%. Так можно обойти неудобное умножение на 0,05.',steps:['Найди 10%: раздели исходное число на 10.','Раздели полученный результат пополам.','Проверь, что ответ меньше 10% вдвое.'],example:'5% от 360: 10% = 36; половина от 36 — 18.'},
  m0_quarter:{title:'Найти четверть',plain:'25% — это четверть: целое разделили на четыре одинаковые части и взяли одну.',steps:['Раздели число на 4.','Если удобно, дели пополам два раза.','Проверь: четыре найденные части должны вернуть целое.'],example:'25% от 320: 320 / 2 = 160; 160 / 2 = 80.'},
  m0_fifteen_percent:{title:'Сложить 10% и 5%',plain:'15% удобно разбить на две знакомые части: 10% и 5%. Для 5% уже известен быстрый ход: взять половину от 10%.',steps:['Найди 10% от исходного числа.','Возьми половину результата: это 5%.','Сложи 10% и 5%.'],example:'15% от 240: 10% = 24; 5% = 12; 24 + 12 = 36.'},
  m0_times_five:{title:'Умножить на 5',plain:'Пять — это половина от десяти. Поэтому умножение на 5 можно заменить на умножение на 10, а затем на деление пополам.',steps:['Умножь число на 10.','Раздели результат на 2.','Сверь ответ с прикидкой: он должен быть примерно в пять раз больше исходного числа.'],example:'48 × 5: 48 × 10 = 480; половина от 480 — 240.'},
  m0_divide_five:{title:'Разделить на 5',plain:'Деление на 5 можно сделать удобнее: сначала удвоить число, а потом разделить на 10. Это точный равный приём.',steps:['Умножь делимое на 2.','Раздели полученное число на 10.','Проверь обратным действием: ответ × 5 должен вернуть исходное число.'],example:'360 / 5: 360 × 2 = 720; 720 / 10 = 72.'},
  m0_fraction_quantity:{title:'Найти несколько частей числа',plain:'В записи 3/8 нижнее число 8 говорит, на сколько равных частей поделить целое. Верхнее число 3 показывает, сколько таких частей взять.',steps:['Раздели целое на нижнее число — найди одну часть.','Умножь одну часть на верхнее число.','Проверь, что взято меньше целого, если числитель меньше знаменателя.'],example:'3/8 от 240: одна восьмая — 240 / 8 = 30; три восьмых — 30 × 3 = 90.'},
  m0_estimate:{title:'Прикинуть ответ',plain:'Прикидка нужна, чтобы быстро понять порядок числа и заметить грубую ошибку. Мы округляем до удобных чисел, считаем пример и помним, что это не точный ответ.',steps:['Округли каждый множитель по условию.','Перемножь удобные числа.','Назови результат примерно и сравни его с исходными числами.'],example:'198 × 49: округляем до 200 × 50; получаем примерно 10 000. Точный результат немного меньше.'},
  m0_add_split:{title:'Сложить числа по разрядам',plain:'Большое сложение можно разбить на две меньшие задачи. Отдельно складываем крупные части, отдельно оставшиеся десятки и единицы, потом собираем всё вместе.',steps:['Разложи числа на сотни, десятки и единицы.','Сложи одинаковые разряды.','Собери части; если остаток перешёл через сотню или десяток, перенеси его.','Проверь прикидкой: ответ должен быть больше каждого слагаемого.'],example:'47 + 36: 40 + 30 = 70; 7 + 6 = 13; 70 + 13 = 83.'},
  m0_subtract_split:{title:'Вычесть число по частям',plain:'Чтобы вычесть 47, можно сначала убрать 40, затем ещё 7. Так не нужно держать в голове всё действие сразу.',steps:['Раздели вычитаемое на десятки и остаток.','Сначала вычти десятки.','Затем вычти единицы или остаток.','Проверь сложением: ответ плюс вычитаемое возвращает исходное число.'],example:'83 − 47: 83 − 40 = 43; 43 − 7 = 36; проверка: 36 + 47 = 83.'},
  m0_add_compensate:{title:'Сложить через круглое число',plain:'Если число почти круглое, можно временно довести его до круглого, а затем сделать такую же поправку у второго слагаемого. Сумма не изменится.',steps:['Найди число, которому не хватает совсем немного до сотни или тысячи.','Добавь недостающее к нему, чтобы получить круглое число.','Убери это же количество из второго слагаемого.','Сложи обновлённые числа.'],example:'198 + 47: прибавили 2 к 198, значит убираем 2 из 47: 200 + 45 = 245.'},
  m0_subtract_compensate:{title:'Вычесть почти круглое число',plain:'Число 198 почти равно 200. Если вычесть вместо него 200, ты уберёшь на 2 больше нужного; верни эти 2 обратно.',steps:['Округли вычитаемое до ближайшей удобной сотни.','Вычти круглое число.','Посмотри, на сколько округление отличалось от настоящего числа.','Исправь результат в обратную сторону.'],example:'502 − 198: 502 − 200 = 302, но вычли лишние 2; 302 + 2 = 304.'},
  m0_multiply_split:{title:'Умножить разложением',plain:'Умножение распределяется на части: если 23 — это 20 и 3, то 23 раза по 4 — это 20 раз по 4 плюс 3 раза по 4.',steps:['Разложи одно число на десятки и единицы (или сотни и остаток).','Умножь каждую часть на второй множитель.','Сложи полученные произведения.','Проверь примерной оценкой.'],example:'23 × 4: 20 × 4 = 80; 3 × 4 = 12; 80 + 12 = 92.'},
  m0_multiply_9_11:{title:'Умножить на 9 или 11',plain:'Девять на единицу меньше десяти, а одиннадцать на единицу больше. Поэтому сначала умножаем на 10, а затем убираем или добавляем исходное число.',steps:['Умножь число на 10.','Для ×9 вычти исходное число.','Для ×11 прибавь исходное число.','Проверь: ×9 немного меньше ×10, ×11 немного больше.'],example:'37 × 9: 370 − 37 = 333. Для 37 × 11 было бы 370 + 37 = 407.'},
  m0_multiply_25:{title:'Умножить на 25',plain:'25 — это четверть от 100. Умножить на 25 можно так: умножить на 100 и разделить на 4.',steps:['Умножь число на 100, то есть приписать два нуля или передвинуть запятую.','Раздели полученное на 4.','Проверь, что результат примерно в 25 раз больше начального числа.'],example:'36 × 25: 36 × 100 = 3600; четверть от 3600 — 900.'},
  m0_divide_2_4_8:{title:'Разделить на 2, 4 или 8',plain:'Четыре — это два раза по 2, а восемь — три раза по 2. Поэтому деление на 4 или 8 можно выполнить последовательными делениями пополам.',steps:['Посмотри, сколько двоек содержится в делителе: 2 — одна, 4 — две, 8 — три.','Дели число пополам нужное количество раз.','Проверь обратным умножением.'],example:'784 / 8: 784 / 2 = 392; /2 = 196; /2 = 98.'},
  m0_divide_facts:{title:'Делить через обратное умножение',plain:'Деление спрашивает: «Сколько таких групп помещается?» Иначе можно спросить: «На что умножить делитель, чтобы получить исходное число?»',steps:['Запиши вопрос как обратное умножение.','Найди близкое круглое произведение.','Посчитай остаток и сколько раз делитель помещается в остатке.','Умножь ответ на делитель для проверки.'],example:'156 / 12: 12 × 10 = 120, остаётся 36; 12 × 3 = 36; частное 10 + 3 = 13.'},
  m0_decimal_add_sub:{title:'Сложить или вычесть десятичные числа',plain:'Десятичная запятая разделяет целые и доли целого. Чтобы не перепутать разряды, выровняй запятые и при необходимости допиши справа нули: 2,4 = 2,40.',steps:['Поставь числа одно под другим, выровняв запятые.','Сложи или вычти цифры одинаковых разрядов.','Поставь запятую в ответе прямо под запятыми в примере.','Проверь примерной оценкой.'],example:'2,4 + 1,35 = 2,40 + 1,35 = 3,75.'},
  m0_decimal_multiply:{title:'Умножить десятичное число',plain:'Сначала умножь числа, временно убрав запятую. Если у первого числа была одна цифра после запятой, ты увеличил его в десять раз — поэтому готовый результат надо разделить на десять.',steps:['Посчитай произведение без запятой.','Посчитай, во сколько раз временно увеличил число.','Уменьши произведение во столько же раз.','Проверь порядок ответа.'],example:'1,2 × 15: 12 × 15 = 180; так как 1,2 в десять раз меньше 12, ответ 180 / 10 = 18.'},
  m0_fraction_percent:{title:'Перевести обычную дробь в проценты',plain:'Дробь показывает, какую часть целого ты взял. Сначала раздели верхнее число на нижнее, чтобы получить долю; затем умножь эту долю на 100, потому что процент означает «из ста».',steps:['Раздели числитель на знаменатель.','Полученное десятичное число — часть от целого.','Умножь её на 100 и добавь знак процента.','Проверь, меньше или больше половины должна быть доля.'],example:'3/8 = 3 / 8 = 0,375; 0,375 × 100 = 37,5%.'},
  m0_fraction_quantity_varied:{title:'Найти дробную часть числа',plain:'Нижнее число дроби говорит, на сколько одинаковых частей делить всё число. Верхнее говорит, сколько таких частей взять.',steps:['Раздели целое на знаменатель и найди одну часть.','Умножь размер этой части на числитель.','Проверь, что результат меньше целого, если дробь меньше единицы.'],example:'5/6 от 72: одна шестая — 72 / 6 = 12; пять частей — 12 × 5 = 60.'},
  m0_estimate_division:{title:'Прикинуть частное',plain:'Для быстрой оценки округли делимое и делитель так, чтобы делить было легко. Ответ будет приблизительным, потому что исходные числа немного отличаются от округлённых.',steps:['Найди близкие удобные числа.','Раздели округлённые числа.','Скажи «примерно» и оцени, чуть выше или ниже точного ответа.'],example:'1995 / 39: примерно 2000 / 40 = 50. Точное частное немного больше 50.'},
  m0_scale_units:{title:'Перевести тысячи и миллионы',plain:'Перед сложением или вычитанием суммы должны быть записаны в одинаковых единицах. В одном миллионе тысяча тысяч, поэтому 2,4 млн — это 2400 тыс.',steps:['Выбери единицу ответа: тысячи или миллионы.','Переведи все суммы в выбранную единицу.','Сложи или вычти обычные числа.','Верни единицу в ответ и проверь разряд.'],example:'3,2 млн − 750 тыс.: это 3200 тыс. − 750 тыс. = 2450 тыс. = 2,45 млн.'},
  m0_percent_decompose:{title:'Посчитать процент через близкое значение',plain:'Не всегда нужно считать процент напрямую. Часто проще взять близкий круглый процент, который легко найти, а затем добавить или вычесть маленькую поправку.',steps:['Найди ближайшие 10%: например, 19% близко к 20%.','Посчитай круглый процент от исходного числа.','Отдельно посчитай разницу в процентах.','Прибавь или убери поправку в нужную сторону.'],example:'19% от 300: 20% = 60; 1% = 3; значит 19% = 60 − 3 = 57.'},
  m0_complements:{title:'Быстро дополнить до круглого числа',plain:'Чтобы узнать, сколько не хватает до 100, 1 000 или другой круглой суммы, пройди путь двумя короткими шагами: сначала до ближайшего десятка или сотни, потом до цели.',steps:['Дойди от исходного числа до ближайшей удобной круглой отметки.','Посчитай оставшееся расстояние от этой отметки до цели.','Сложи два коротких расстояния.','Проверь сложением: исходное число плюс ответ должно дать круглую цель.'],example:'Сколько не хватает от 63 до 100? До 70 не хватает 7; от 70 до 100 — ещё 30; всего 7 + 30 = 37.'},
  m0_multiply_two_digit:{title:'Умножить на двузначное число в уме',plain:'Двузначный множитель состоит из десятков и единиц. Например, 14 — это 10 и ещё 4. Умножь другой множитель на каждую часть отдельно, потом сложи результаты.',steps:['Разложи двузначный множитель на десятки и единицы.','Умножь другое число на десятки.','Умножь его на оставшиеся единицы.','Сложи два произведения и прикинь порядок ответа.'],example:'23 × 14: 14 = 10 + 4; 23 × 10 = 230; 23 × 4 = 92; 230 + 92 = 322.'},
  m0_decimal_division:{title:'Разделить числа с запятой',plain:'Если делитель целый, раздели десятые или сотые делимого и сохрани их единицу. Если в делителе есть запятая, передвинь запятую в обоих числах на одинаковое число знаков: отношение и ответ от этого не меняются.',steps:['Посмотри, целый ли делитель.','Если у делителя есть десятичная часть, одинаково сдвинь запятую в делимом и делителе, пока делитель не станет целым.','Выполни обычное деление.','Проверь умножением: частное × делитель должно вернуть делимое.'],example:'8,4 / 0,7: передвигаем обе запятые на один знак, получаем 84 / 7 = 12. Проверка: 12 × 0,7 = 8,4. Если делитель целый: 7,5 / 3 = 75 десятых / 3 = 25 десятых = 2,5.'},
  m0_fraction_arithmetic:{title:'Сложить или вычесть дроби',plain:'Знаменатель показывает размер кусочка. Нельзя складывать кусочки разного размера, пока не приведёшь их к одинаковому размеру. Когда знаменатели равны, выполняй действие только с числителями.',steps:['Сравни знаменатели.','Если они разные, найди число, которое делится на оба знаменателя.','Чтобы получить его внизу каждой дроби, умножь верх и низ этой дроби на одно и то же число: значение дроби не изменится.','Выполни действие с числителями, оставь общий знаменатель и переведи результат в десятичный вид.'],example:'2/3 + 1/6: общий знаменатель 6. Умножаем верх и низ 2/3 на 2: получаем 4/6. Теперь 4/6 + 1/6 = 5/6 ≈ 0,8333.'},
  m0_quick_facts:{title:'Быстрые факты умножения и деления',plain:'Часть примеров удобно знать на память, но если ответ не вспоминается, деление можно проверить обратным умножением. Например, 56 / 7 — это вопрос «7 умножить на сколько, чтобы получить 56?».',steps:['Если видишь умножение, вспомни число групп и размер каждой группы.','Если видишь деление, преврати его в вопрос об обратном умножении.','Для больших чисел разбей один множитель на удобные части или удваивай постепенно.','Проверь прикидкой и обратным действием.'],example:'360 / 15: 15 × 20 = 300, осталось 60; это ещё 15 × 4. Значит частное 20 + 4 = 24.'},
  m0_decimal_multiply_decimal:{title:'Умножить два десятичных числа',plain:'Убери запятые и сначала умножь как целые числа. Но помни: если в каждом числе была одна цифра после запятой, ты увеличил оба числа в 10 раз, а произведение — в 100 раз. В конце раздели его на 100.',steps:['Посчитай произведение, временно убрав запятые.','Посчитай, сколько цифр после запятой было в обоих числах вместе.','Передвинь запятую в произведении влево на это количество знаков.','Проверь ответ прикидкой: например, 1,2 × 1,5 должно быть около 2, а не 18.'],example:'1,2 × 1,5: 12 × 15 = 180. Убрали две цифры после запятых вместе, поэтому 180 / 100 = 1,8.'},
  m0_order_operations:{title:'Соблюдать порядок действий',plain:'В одном примере не все действия выполняются по очереди слева направо. Сначала считай то, что в скобках. Потом умножение и деление, двигаясь слева направо. В конце — сложение и вычитание, тоже слева направо.',steps:['Выполни действия в скобках.','Выполни умножение и деление слева направо.','Выполни сложение и вычитание слева направо.','После каждого шага перепиши пример, чтобы не потерять числа.'],example:'8 + 3 × 4: сначала 3 × 4 = 12; затем 8 + 12 = 20. Если идти просто слева направо, выйдет неверный ответ.'},
  m1_percentage_points:{title:'Не путать проценты и процентные пункты',plain:'Если показатель вырос с 20% до 25%, его разница — 5 процентных пунктов. Относительно прежних 20% это рост на 25%. Одинаковые числа, но разные вопросы.',steps:['Если спрашивают «на сколько процентных пунктов», просто вычти старый процент из нового.','Если спрашивают «на сколько процентов вырос», раздели разницу на исходный процент.','Проговори единицу ответа: п.п. или %.'],example:'С 20% до 25%: разница 25 − 20 = 5 п.п.; относительный рост 5 / 20 = 25%.'},
  m1_growth:{title:'Посчитать рост в процентах',plain:'Процент роста сравнивает прибавку с прежним значением. Старое значение — база, потому что именно относительно него произошёл рост.',steps:['Найди прибавку: новое значение минус старое.','Раздели прибавку на старое значение.','Чтобы получить проценты, умножь долю на 100.'],example:'С 80 до 100: прибавка 20; 20 / 80 = 1/4 = 25%.'},
  m1_drop:{title:'Посчитать снижение в процентах',plain:'Процент снижения сравнивает потерю с тем, что было до снижения. Не дели разницу на новое, уже уменьшенное значение.',steps:['Найди, насколько число уменьшилось.','Раздели уменьшение на исходное число.','Переведи долю в проценты и проверь, что снижение меньше 100%.'],example:'С 100 до 80: снижение 20; 20 / 100 = 20%.'},
  m1_reverse_growth:{title:'Вернуться к прежнему значению',plain:'После снижения процент для возврата считают от нового, меньшего числа. Один и тот же разрыв выглядит больше относительно меньшей базы.',steps:['Найди разницу между прежним и нынешним значениями.','Раздели разницу на нынешнее значение.','Умножь долю на 100, чтобы получить процент роста для возврата.'],example:'Было 100, стало 80: разница 20; 20 / 80 = 25%. Нужно вырасти на 25% от 80.'},
  m1_cagr:{title:'Средний рост за несколько лет',plain:'CAGR — это одинаковый годовой рост, который привёл бы к тому же конечному значению. Он учитывает, что каждый новый процент начисляется на уже выросшую сумму.',steps:['Найди, во сколько раз итог больше начала: конец / начало.','Найди одинаковый множитель за год: для двух лет — число, которое при умножении само на себя даёт общий множитель.','Вычти 1 из годового множителя и переведи остаток в проценты.'],example:'100 выросло до 144 за 2 года. Общий множитель 1,44; √1,44 = 1,2; значит рост был 20% в год.'},
  m1_multi_period:{title:'Рост за несколько периодов',plain:'Если рост повторяется каждый период, следующая прибавка считается уже от нового значения. Поэтому проценты нельзя просто сложить.',steps:['Представь исходное число как 100.','Для каждого роста умножай на соответствующий множитель.','Сравни итог со 100 и назови общий рост.'],example:'100 → рост 10%: 110 → ещё 10%: 121. Общий рост 21%, а не 20%.'},
  m1_margin:{title:'Маржа и правильная база',plain:'Маржа показывает, какая часть цены продажи остаётся после переменных затрат. База для маржи — цена продажи, а не себестоимость.',steps:['Вычти затраты из цены: получишь маржу в деньгах.','Раздели эту разницу на цену продажи.','Переведи результат в проценты.'],example:'Цена 500, затраты 380: разница 120; 120 / 500 = 24% маржи.'},
  m2_weighted_average:{title:'Среднее с учётом размеров групп',plain:'Среднее группы — это общий итог, разделённый на число людей или предметов. Большая группа должна влиять сильнее маленькой.',steps:['Для каждой группы найди общий итог: количество × значение.','Сложи итоги групп.','Раздели на общее количество.','Проверь: ответ должен быть между минимальным и максимальным значениями.'],example:'2 человека получают 100, 8 получают 50: (2×100 + 8×50) / 10 = 60.'},
  m2_average_recovery:{title:'Найти неизвестное число через среднее',plain:'Среднее можно превратить обратно в общую сумму: среднее × количество. Так находим, сколько добавилось или сколько не хватает.',steps:['Найди сумму до изменения: старое среднее × старое количество.','Найди сумму после изменения: новое среднее × новое количество.','Вычти старую сумму из новой.'],example:'У 4 чисел среднее 25: сумма 100. У 5 чисел среднее 30: сумма 150. Пятое число — 50.'},
  m2_percent_of_whole:{title:'Процент от целого',plain:'Процент — это доля части от общего количества. Сначала выясни, что здесь считается целым, затем дели часть на это целое.',steps:['Назови целое количество или объём.','Раздели нужную часть на целое.','Умножь на 100, если ответ нужен в процентах.'],example:'30% от рынка в 12 млн: 12 млн × 0,30 = 3,6 млн.'},
  m2_weighted_rate:{title:'Средняя ставка с весами',plain:'Если разные доли объёма работают по разным ставкам, каждая ставка влияет только на свою долю. Взвесь вклад каждой группы.',steps:['Переведи доли групп в числа или десятичные части.','Умножь долю каждой группы на её ставку.','Сложи вклады.'],example:'40% объёма под 10% и 60% под 20%: 0,4×10 + 0,6×20 = 16%.'},
  m2_expected_count:{title:'Среднее число случаев',plain:'Если каждый случай происходит с одной и той же вероятностью, среднее число таких случаев — это количество попыток, умноженное на вероятность одного случая.',steps:['Запиши число попыток.','Переведи процент в долю.','Умножь число попыток на эту долю.'],example:'В среднем 3% из 200 заявок: 200 × 0,03 = 6 заявок.'},
  m2_share:{title:'Доля от общего количества',plain:'Когда спрашивают долю успешных, знаменатель — все случаи, и успешные, и неуспешные.',steps:['Сложи все группы, чтобы получить целое.','Раздели нужную часть на целое.','Переведи результат в проценты, если требуется.'],example:'6 успешных и 4 неуспешных: всего 10; доля успешных 6 / 10 = 60%.'},
  m2_mixture:{title:'Смешать группы разного размера',plain:'В смеси нельзя просто усреднить два процента, если объёмы отличаются. Сначала посчитай, сколько нужного вещества или результата даёт каждая группа.',steps:['Для каждой группы найди её вклад: объём × доля.','Сложи вклады.','Раздели на общий объём.'],example:'2 л 20%-го и 3 л 40%-го раствора: (2×20 + 3×40) / 5 = 32%.'},
  m2_conversion:{title:'Перевести конверсию в количество',plain:'Конверсия говорит, какая часть входящих случаев дошла до результата. Чтобы найти число результатов, умножь входящий объём на эту долю.',steps:['Переведи процент в долю: 3,5% = 0,035.','Умножь число входящих случаев на долю.','Проверь, что результат меньше исходного количества, если процент меньше 100%.'],example:'12 000 визитов при конверсии 3,5%: 12 000×0,03 = 360; ещё 12 000×0,005 = 60; всего 420 заказов.'},
  m3_parallel_rates:{title:'Сложить параллельные скорости',plain:'Если два независимых потока одновременно делают одну и ту же работу, за час они вместе выполняют сумму того, что каждый успел бы сделать отдельно.',steps:['Приведи скорости к одинаковым единицам.','Сложи объёмы за один час.','Раздели весь объём работы на общую скорость.'],example:'Потоки делают 2 и 3 задачи в час. Вместе — 5 в час; 60 задач займут 60 / 5 = 12 часов.'},
  m3_joint_work:{title:'Совместная работа',plain:'Если известны только сроки, сначала переведи каждый срок в долю работы за час. Например, 1/4 работы за час означает, что весь заказ занял бы 4 часа.',steps:['Для каждого исполнителя запиши долю работы за единицу времени.','Сложи доли: это общая скорость.','Раздели одну целую работу на общую скорость.'],example:'Один делает работу за 6 часов, другой за 3: за час они делают 1/6 + 1/3 = 1/2 работы; весь объём займёт 2 часа.'},
  m3_unit_rate:{title:'Найти скорость за единицу времени',plain:'Скорость отвечает на вопрос «сколько работы приходится на один час или день». Для этого общий объём делят на прошедшее время.',steps:['Проверь, что знаешь общий объём.','Раздели его на время.','Подпиши единицы: например, задач в час.'],example:'180 заявок за 3 часа: 180 / 3 = 60 заявок в час.'},
  m3_rate_capacity:{title:'Найти объём по скорости',plain:'Если знаешь, сколько делается за час, общий объём находится умножением скорости на число часов.',steps:['Запиши скорость за один час.','Умножь её на количество часов.','Проверь, что ответ больше объёма за один час.'],example:'25 задач в час за 6 часов: 25 × 6 = 150 задач.'},
  m3_parallel_finish:{title:'Параллельные этапы',plain:'Если два этапа идут одновременно, общий срок определяется тем, который закончится позже. Более короткий этап уже успевает завершиться внутри этого времени.',steps:['Определи, какие работы идут одновременно.','Сравни их длительность.','Возьми более длинный срок; прибавляй только последующие последовательные этапы.'],example:'Этап A — 2 дня, B — 5 дней параллельно. Оба готовы через 5 дней, не через 7.'},
  m3_work_duration:{title:'Объём, скорость и срок',plain:'Три величины связаны: объём равен скорости, умноженной на время. Если нужны часы, раздели объём на скорость; если нужен объём — умножь.',steps:['Подпиши, что дано: объём, скорость или время.','Выбери действие: объём / скорость или скорость × время.','Проверь единицы измерения.'],example:'500 записей при скорости 100 в час: 500 / 100 = 5 часов.'},
  m3_ratio_growth:{title:'Сравнить темп отношением',plain:'«Во сколько раз» спрашивает, сколько раз новое значение помещается в старом. Это деление, а не вычитание.',steps:['Уточни, какое значение сравниваем с каким.','Раздели новое значение на старое.','Назови ответ в разах.'],example:'Скорость выросла с 6 до 12 задач в час: 12 / 6 = 2 раза.'},
  m3_bottleneck:{title:'Найти узкое место',plain:'В цепочке последовательных этапов весь поток ограничивает самый медленный этап. Быстрые этапы не могут протолкнуть через него больше работы.',steps:['Выпиши скорость каждого этапа в одной единице.','Найди наименьшую скорость.','Назови её как верхнюю границу общей пропускной способности.'],example:'Этапы дают 12, 5 и 15 задач в час. Вся цепочка пропускает не больше 5 задач в час.'},
  m3_capacity_gap:{title:'Найти разрыв мощности',plain:'Если запросов приходит больше, чем команда успевает обработать, очередь растёт на разницу за каждый час.',steps:['Вычти обработанные задачи из входящих за час.','Умножь разницу на число часов.','Если обработка выше входящего потока, очередь уменьшается.'],example:'12 запросов в час, обработка 10: прибавляется 2 в час; за 8 часов очередь вырастет на 16.'},
  m3_required_rate:{title:'Найти нужную скорость',plain:'Чтобы успеть к сроку, раздели весь объём на число дней или часов. Полученное число — минимальная средняя скорость.',steps:['Выпиши общий объём.','Выпиши доступное время.','Раздели объём на время и проверь единицы.'],example:'Нужно сделать 300 задач за 5 дней: 300 / 5 = 60 задач в день.'},
  m4_parts_of_total:{title:'Отношение — это равные части',plain:'Запись 3:5 означает три одинаковые части первой группы и пять таких же частей второй. Если дано целое, обе стороны вместе образуют всё количество.',steps:['Сложи части отношения.','Раздели целое на это число: получишь размер одной части.','Умножь размер части на число частей нужной группы.'],example:'3:5 и всего 40: всего 8 частей; 40 / 8 = 5 в каждой; первая группа 3 × 5 = 15.'},
  m4_scale_ratio:{title:'Масштабировать обе стороны',plain:'Отношение сохраняется, если обе стороны умножить на одно и то же число. Если известна одна сторона, сначала найди, сколько единиц составляет одна часть.',steps:['Посмотри, сколько частей в известной стороне.','Раздели известное количество на число этих частей.','Умножь одну часть на число частей второй стороны.'],example:'A:B = 2:3, A = 18: одна часть 18 / 2 = 9; B = 3 × 9 = 27.'},
  m4_part_to_whole:{title:'Перевести отношение в долю целого',plain:'Чтобы узнать, какую часть от общего составляет A, сначала сложи части A и B. Потом сравни части A с их общей суммой.',steps:['Сложи стороны отношения.','Раздели части A на общее число частей.','Умножь на 100 для ответа в процентах.'],example:'A:B = 2:3: всего 5 частей; A занимает 2/5 = 40%.'},
  m4_compare:{title:'Сравнить доли при разных размерах групп',plain:'Число успехов само по себе не показывает, кто справился лучше, если у групп было разное количество попыток. Сравни успехи на одну попытку.',steps:['Для каждой группы раздели успехи на все попытки.','Сравни полученные доли или проценты.','Скажи, почему абсолютные числа здесь вводят в заблуждение.'],example:'18 из 24 — 75%; 20 из 30 — около 67%. Первая доля выше, хотя успехов меньше.'},
  m4_unit_rate:{title:'Найти количество или цену на единицу',plain:'Удельная величина отвечает на вопрос «сколько приходится на одну штуку, килограмм или билет». Сначала дели общий итог на количество единиц.',steps:['Раздели общую цену или объём на количество.','Так найди значение одной единицы.','Умножь его на нужное количество.'],example:'7 билетов стоят 56: один стоит 8; 11 билетов стоят 11 × 8 = 88.'},
  m4_direct_proportion:{title:'Прямая пропорция',plain:'При прямой пропорции обе величины растут или уменьшаются вместе. Если людей стало вдвое больше и порция та же, продуктов тоже нужно вдвое больше.',steps:['Найди значение на одну единицу.','Умножь его на новое количество единиц.','Проверь: если одна величина выросла, другая должна вырасти в том же масштабе.'],example:'На 3 порции нужно 240 г: на одну — 80 г; на 8 — 8 × 80 = 640 г.'},
  m4_inverse_proportion:{title:'Обратная пропорция',plain:'При одинаковой работе больше одинаково быстрых работников означает меньше времени. Общее количество человеко-часов остаётся тем же.',steps:['Посчитай объём работы: работники × часы.','Раздели его на новое число работников.','Проверь направление: работников стало больше, срок должен уменьшиться.'],example:'4 станка работают 12 часов: 48 станко-часов. 6 станков сделают заказ за 48 / 6 = 8 часов.'},
  m4_adjust_ratio:{title:'Изменить количества в отношении',plain:'Сначала преврати части отношения в реальные количества. После этого можно понять, сколько нужно добавить или убрать, чтобы сравнять группы.',steps:['Умножь каждую сторону отношения на размер одной части.','Найди разницу реальных количеств.','Убери или добавь эту разницу согласно вопросу.'],example:'2:3 при размере части 6 — это 12 и 18. Чтобы сравнять, убираем 6 из большей группы.'},
  m4_chain_ratio:{title:'Объединить два отношения',plain:'Если A сравнивают с B, а затем B с C, число частей B должно быть одинаковым в обеих записях. Только после этого можно соединить три величины.',steps:['Найди общий размер частей B в двух отношениях.','Умножь обе стороны каждого отношения так, чтобы B совпало.','Запиши A:B:C и, если просят, сложи все его части.'],example:'A:B = 2:3 и B:C = 4:5. Общая часть B — 12; получаем 8:12:15.'},
  m4_find_total:{title:'Найти целое по одной стороне',plain:'Если известно количество одной группы, можно узнать размер части, а затем сложить части обеих групп, чтобы восстановить целое.',steps:['Раздели известное количество на его число частей.','Сложи части двух групп.','Умножь общее число частей на размер одной.'],example:'A:B = 4:3, A = 28: одна часть 7; всего частей 7; целое 7 × 7 = 49.'},
  m4_difference:{title:'Найти часть по разнице',plain:'Если известна разница двух количеств, сравни разницу частей в отношении. Так можно найти размер одной части.',steps:['Вычти меньшую сторону отношения из большей.','Раздели известную разницу на это число частей.','Умножь размер одной части на части меньшей группы.'],example:'Отношение 4:7, разница 15: разница 3 части; одна часть 5; меньшее количество 4 × 5 = 20.'},
  m1_part:{title:'Процент от числа',plain:'Процент — это кусочек от ста. Чтобы найти процент от числа, сначала превращаем процент в долю: 15% = 15/100 = 0,15. Потом умножаем эту долю на всё число.',steps:['Узнай, от какого числа берём кусочек.','Раздели процент на 100.','Умножь получившуюся долю на исходное число.','Проверь здравый смысл: 15% должно быть меньше самого числа.'],example:'15% от 240: 0,15 × 240 = 36.'},
  m1_reverse_drop:{title:'Обратное снижение',plain:'Если число уменьшили, а потом спрашивают, на сколько процентов нужно вернуть его назад, процент считают от текущего, меньшего числа. Старое и новое число имеют разные базы.',steps:['Найди разницу между старым и новым числом.','Раздели разницу на число, к которому возвращаемся.','Умножь на 100 и назови единицу: проценты.'],example:'92 нужно вернуть к 80: разница 12; 12/92 ≈ 13%, а не 12%.'},
  m1_find_base:{title:'Найти исходную базу',plain:'Иногда известен кусочек, но неизвестно всё число. Если 120 — это 75% от выручки, значит 120 занимает три четверти целого. Чтобы восстановить целое, делим кусочек на долю.',steps:['Переведи процент в долю: 75% = 0,75.','Раздели известную часть на эту долю.','Проверь: найденное целое × 0,75 должно вернуть исходную часть.'],example:'120 / 0,75 = 160.'},
  m1_sequential:{title:'Проценты по очереди',plain:'Когда изменение происходит несколько раз, каждый новый процент применяется уже к изменённому числу. Поэтому проценты по очереди нельзя просто складывать.',steps:['Запиши каждое изменение как множитель.','Рост на 20% = ×1,20; снижение на 30% = ×0,70.','Перемножь множители.','Сравни результат с исходными 100%.'],example:'100 → 70 → 84. Снижение на 30%, затем рост на 20% даёт итог 84%, то есть минус 16%.'},
  m1_compensation:{title:'Компенсировать снижение',plain:'Если цена упала, прежний объём продаж уже не даёт прежнюю выручку. Чтобы компенсировать падение, объём должен вырасти сильнее, чем цена упала.',steps:['Переведи новую цену в долю старой.','Раздели старую выручку на новую цену.','Сравни новый объём со старым.'],example:'Цена стала 80% от старой: 1/0,8 = 1,25. Объём нужно увеличить на 25%.'},
  p1_without_replacement:{title:'Выбор без возвращения',plain:'После первого вытаскивания состав коробки меняется. Поэтому шанс второго вытаскивания нужно считать уже для оставшихся предметов.',steps:['Посчитай подходящие предметы и все предметы в начале.','Удали первый предмет из обоих счётчиков, если он подходящий.','Для двух событий «и» перемножь первый и второй шансы.','Проверь, что во втором знаменателе предметов на один меньше.'],example:'3 красных и 2 синих: первый красный 3/5; потом остаются 2 красных из 4; 3/5 × 2/4 = 30%.'},
  p1_dice:{title:'Перечень исходов на костях',plain:'У двух костей результат — это пара чисел, а не только итоговая сумма. Пара 2 и 6 отличается от пары 6 и 2, потому что первая кость и вторая кость различимы.',steps:['Всего пар: 6 × 6 = 36.','Выпиши все пары, которые дают нужную сумму.','Раздели число подходящих пар на 36.'],example:'Сумма 8: пять пар, поэтому 5/36 ≈ 13,9%.'},
  p1_combinations:{title:'Сочетания без порядка',plain:'Если выбираем команду или пару, порядок не важен: Анна–Борис и Борис–Анна — одна и та же пара. Поэтому сначала считаем пары руками и не используем формулы.',steps:['Назови людей буквами и выпиши пары.','С первым человеком будет 4 новые пары, со вторым — 3, затем 2 и 1.','Сложи: 4 + 3 + 2 + 1 = 10.','Только после этого разберём, откуда берётся факториальная запись.'],example:'Из 5 человек: АБ, АВ, АГ, АД; БВ, БГ, БД; ВГ, ВД; ГД. Всего 10 пар.',next:['Факториал — это просто произведение чисел: 5! = 5 × 4 × 3 × 2 × 1.','В записи C(5,2) верхнее 5 означает «всего 5 человек», а нижнее 2 — «выбираем двоих».','Оставшихся людей 5 − 2 = 3, поэтому появляется 3! внизу.','Получаем C(5,2) = 5!/(2! × 3!) = 120/(2 × 6) = 10.','Почему делим на 2!? Выбранную пару можно назвать двумя способами: АБ и БА. Почему делим на 3!? Троих невыбранных можно переставлять, но выбранная пара от этого не меняется.']},
  p1_exactly_one_two_draws:{title:'Ровно один представитель при двух выборах',plain:'Ровно один представитель двух групп может появиться в двух порядках: сначала берём из первой группы, затем из второй; либо наоборот. Если выбор без возврата, после первого выбора предметов становится меньше.',steps:['Назови два подходящих порядка: A→B и B→A.','Для каждого порядка посчитай шанс первого и второго выбора.','В каждом порядке перемножь эти шансы: должны случиться оба шага.','Сложи два результата: пути разные и не могут случиться одновременно.','Проверь, что во втором знаменателе на один предмет меньше.'],example:{q:'В коробке 3 красных и 2 синих жетона. Достаём два без возврата. Какова вероятность ровно одного красного?',a:['Путь К→С: 3/5 × 2/4 = 6/20.','Путь С→К: 2/5 × 3/4 = 6/20.','Складываем: 6/20 + 6/20 = 12/20 = 60%.','Сложили два отдельных порядка, а не вероятности цветов сами по себе.']}},
  p1_exactly_two_of_four:{title:'Ровно два успеха из четырёх',plain:'Пока не нужна формула сочетаний. Считай каждый полный порядок исходов отдельным вариантом. Найди все варианты, где успех случился ровно два раза, и сравни их с общим числом вариантов.',steps:['Обозначь успех буквой У, неуспех — Н.','У каждого из четырёх испытаний два исхода, всего 2 × 2 × 2 × 2 = 16 последовательностей.','Перечисли случаи с двумя У: УУНН, УНУН, УННУ, НУУН, НУНУ, ННУУ.','Шесть подходящих вариантов из шестнадцати: 6/16 = 3/8 = 37,5%.','Проверь слова «ровно два»: три и четыре успеха сюда не входят.'],example:{q:'Честную монету бросают четыре раза. Какова вероятность ровно двух орлов?',a:['Всего последовательностей 16: у каждого броска два исхода.','О — орёл, Р — решка. Подходят ООРР, ОРОР, ОРРО, РООР, РОРО и РРОО — шесть вариантов.','Вероятность: 6/16 = 3/8 = 37,5%.']},next:['Сначала закрепи ручной перебор. Факториалы и сокращённую формулу количества сочетаний можно изучить позже; для этой серии они не требуются.']},
  p1_and:{title:'Независимое «и»',plain:'Слово «и» означает, что должны произойти оба события. Если они независимы, шанс совместного результата получается умножением двух шансов.',steps:['Переведи проценты в доли.','Умножь вероятность первого события на вероятность второго.','Верни ответ в проценты.'],example:'30% и 40% одновременно: 0,3 × 0,4 = 0,12 = 12%.'},
  p1_or:{title:'Несовместимое «или»',plain:'Если возможен только один из вариантов, складываем шансы этих вариантов. Сначала проверь, что события действительно не могут случиться одновременно.',steps:['Пойми, что спрашивают: первый вариант или второй.','Проверь, есть ли пересечение.','Если пересечения нет, сложи вероятности и раздели на общее число исходов.'],example:'3 подходящих вариантов и 2 других: шанс первого или второго подходящего = 5 подходящих из общего числа.'},
  b4_fermi_decomposition:{title:'Прикинуть ответ, когда точных данных нет',plain:'Это не экзамен на угадывание тайного числа. Тебе дают вопрос без исходных данных и смотрят, умеешь ли ты честно собрать оценку из понятных частей. Сначала уточни, что считаем; затем назови допущения, посчитай диапазон и проверь здравый смысл.',steps:['Переформулируй вопрос: что считаем, для кого и за какой период.','Разбей неизвестное на 3–5 частей, которые можно оценить отдельно.','Для каждой части назови низкое и высокое разумное значение.','Посчитай границы, затем дай округлённую центральную оценку.','Назови самое шаткое допущение и данные, которые запросишь первыми.'],example:'Сколько встреч в неделю у 100 сотрудников? Допущение: каждый участвует примерно в 1–3 встречах. Это 100–300 участник-встреч; если в каждой в среднем 4 человека, получится примерно 25–75 самих встреч. Это пример рассуждения, а не отраслевой норматив.'},
  l2_parallel_then_chain:{title:'Сначала параллельные ветки, потом общий этап',plain:'Представь две команды: одна готовит документы, другая строит систему. Если они работают одновременно, запуск не ждёт сумму их сроков: он ждёт ту команду, которая закончит позже. После этого добавляются этапы, которые действительно идут один за другим.',steps:['Раздели задачи на параллельные ветки и последовательные этапы.','Для параллельных веток оставь самый длинный срок.','Прибавь этапы, которые начнутся только после завершения веток.','Сложи числа и назови единицу времени.','Проверь, что зависимость действительно позволяет работать параллельно.'],example:'Документы — 5 дней, разработка — 8 дней; затем тест — 3 дня. Параллельная часть занимает max(5, 8) = 8 дней. Потом тест: 8 + 3 = 11 дней.'},
  l2_critical_path:{title:'Найти критический путь',plain:'Критический путь — самая длинная цепочка работ, где каждая следующая ждёт предыдущую. Пока эта цепочка не завершится, проект целиком не завершится. Короткие параллельные цепочки могут закончиться раньше и подождать.',steps:['Запиши связи: какая работа после какой начинается.','Сложи длительности внутри каждой последовательной цепочки.','Если цепочки идут параллельно, сравни их суммы и возьми самую длинную.','Добавь общие последующие этапы.','Покажи, какая задержка сдвинет весь проект.'],example:'A→C длится 4 + 5 = 9 дней; B→D длится 6 + 2 = 8. Первая ветка критическая: до общей следующей работы нужно ждать 9 дней.'},
  l3_assignments:{title:'Проверить, кто говорит правду',plain:'Каждый человек может быть только правдивым или лжецом. Высказывание правдивого должно быть истинным, а высказывание лжеца — ложным. Это две проверки сразу: мало выбрать тип, нужно сверить его с содержанием слов.',steps:['Запиши возможные типы буквами: П — правдивый, Л — лжец.','Предположи тип одного человека.','Из его слов выведи типы остальных.','Проверь каждую фразу: совпадает ли её истинность с типом говорящего?','Отбрось противоречивые варианты и проверь, остался ли ровно один.'],example:'Если A говорит «B лжец», то при A=П следует B=Л; при A=Л его фраза ложна, значит B=П. Затем проверь слова B.'},
  l3_underdetermined:{title:'Понять, хватает ли данных для одного ответа',plain:'Иногда задача не даёт единственного решения. Чтобы это доказать, нужно предъявить два разных варианта, и оба должны удовлетворять всем условиям.',steps:['Найди один вариант распределения типов.','Проверь каждое высказывание в этом варианте.','Поищи второй, отличный вариант и тоже проверь его.','Если оба подходят, честный ответ: данных недостаточно.'],example:'A: «B лжец», B: «A лжец». Подходят оба набора: (A правдив, B лжец) и (A лжец, B правдив).'},
  l3_inconsistent:{title:'Доказать, что условий нельзя выполнить',plain:'Если ни одно назначение типов не подходит, нельзя просто сказать «есть противоречие». Покажи две ветки проверки: что ломается, если первый правдив, и что ломается, если он лжец.',steps:['Предположи первый возможный тип человека.','Последовательно выведи, какими должны быть остальные.','Найди фразу, которая не может быть правдой или ложью так, как требует говорящий.','Повтори проверку для противоположного типа.','Если обе ветки противоречивы, подходящего решения нет.'],example:'В круге A: «B лжец», B: «C лжец», C: «A лжец» любой выбор A заставляет по кругу получить несовместимый тип.'},
  l3_self_reference:{title:'Разобрать фразу «я всегда лгу»',plain:'Не отвечай сразу «он лжёт». Проверь обе возможности. Если фраза правдива, она говорит, что говорящий всегда лжёт. Если фраза ложна, тогда неправда, что он всегда лжёт. В обоих случаях нужно следить, о чём именно говорит фраза.',steps:['Предположи, что говорящий правдив, и прочитай фразу буквально.','Проверь, не заставляет ли это его одновременно быть лжецом.','Предположи, что он лжец.','Проверь, не превращает ли ложность фразы её содержание в правду.','Назови, возникает ли противоречие или несколько возможных ответов.'],example:'Человек говорит: «Я всегда лгу». Если он правдив, его слова делают его лжецом; если он лжец, сама фраза оказывается правдой. Оба варианта противоречат условиям.'},
  l3_identity_question:{title:'Понять, что ответит правдивый и лжец',plain:'Вопрос «ты правдив?» не помогает узнать тип человека. Правдивый честно ответит «да». Лжец тоже ответит «да»: правильный ответ для него был бы «нет», и он должен солгать.',steps:['Рассмотри правдивого: на вопрос «ты правдив?» ответ «да» — истина.','Рассмотри лжеца: правдивый ответ «нет», поэтому он должен сказать обратное — «да».','Сравни ответы: они одинаковые.','Сделай вывод: этим вопросом нельзя определить, кто перед тобой.','Для различения нужен вопрос, который иначе обрабатывает ответы двух людей, например вопрос через второго стража.'],example:'Правдивый: «да», потому что это правда. Лжец: тоже «да», потому что его честный ответ «нет», а он обязан солгать.'},
  l3_guard:{title:'Задать вопрос двум стражам',plain:'Один страж всегда говорит правду, другой всегда лжёт, а ты не знаешь, кто есть кто. Прямой вопрос не работает: ответ зависит от собеседника. Спроси, что ответил бы другой страж; обе дороги приведут к неверной двери, поэтому выбери противоположную.',steps:['Выбери одну дверь и сформулируй вопрос про ответ напарника.','Спроси: «Какую дверь назвал бы другой страж?»','Правдивый передаст ложный ответ напарника.','Лжец исказит правдивый ответ напарника.','В обоих случаях укажут не на цель: выбери другую дверь.'],example:'Если цель за левой дверью, оба укажут на правую. Выбирай противоположную той, на которую указали.'},
  l4_ternary:{title:'Сокращать варианты втрое на весах',plain:'Чашечные весы дают три исхода: левая тяжелее, правая тяжелее или равновесие. Если заранее известно, что искомая монета одна из группы и она точно легче или точно тяжелее остальных, каждый исход оставляет примерно треть кандидатов.',steps:['Уточни направление: ищем лёгкую или тяжёлую монету.','Раздели подозреваемые монеты на три максимально равные группы.','Сравни на чашах две группы одинакового размера.','Если чаши равны, искомая в третьей группе.','Если ищешь лёгкую, выбирай группу на поднявшейся чаше; если тяжёлую — группу на опустившейся чаше.','Повторяй, пока не останется одна монета.'],example:'9 монет, одна легче: раздели на группы по 3. Равновесие оставит третью группу; иначе лёгкая лежит на поднявшейся чаше. Для тяжёлой монеты направление перевеса будет противоположным.'},
  l4_hypotheses:{title:'Считать не только монеты, но и возможные состояния',plain:'Если фальшивая монета может быть как легче, так и тяжелее, каждая монета создаёт две разные гипотезы. А если нет заведомо настоящей монеты, направления перевеса сложнее истолковать. Числа исходов дают только верхнюю границу, а не готовое решение.',steps:['Перечисли каждую гипотезу: какая монета и легче она или тяжелее.','Посчитай число гипотез и сравни его с 3^число взвешиваний.','Считай это только проверкой вместимости, не доказательством.','Разбери первое взвешивание по исходам и перечисли оставшиеся гипотезы.','Проверь, может ли следующее взвешивание различить их.'],example:'Четыре монеты дают 8 гипотез (четыре возможные фальшивые × два направления). Одно оставшееся взвешивание имеет только три исхода, поэтому некоторые ветки неразрешимы.'},
  l4_jugs:{title:'Отмерить объём разностью',plain:'Если на ёмкостях нет делений, нельзя просто «налить половину». Разрешены только три действия: наполнить, опустошить и перелить до заполнения или опустошения. После каждого действия записывай, сколько в каждой ёмкости.',steps:['Запиши начальные объёмы в обеих ёмкостях.','Наполняй одну и переливай в другую до её края.','Используй остаток как новую известную разность.','Повторяй действия и после каждого шага обновляй обе цифры.','Остановись, когда одна ёмкость содержит нужный объём.'],example:'Ёмкости 5 л и 3 л: наполни 5 и перелей в 3 — останется 2 в большой. Перелей эти 2 в пустую 3-литровую; снова наполни 5 и долей 1 — в большой останется 4.'},
  l4_rope:{title:'Измерить время неравномерным шнуром',plain:'Шнур горит неравномерно, поэтому половина его длины не означает половину времени. Но один шнур, подожжённый одновременно с двух концов, догорит ровно за половину общего времени: фронты огня встречаются посередине по времени.',steps:['Подожги первый 60-минутный шнур с обоих концов.','Одновременно подожги второй шнур с одного конца.','Когда первый догорит, прошло ровно 30 минут и у второго осталось 30 минут горения.','Подожги второй конец второго шнура.','Оставшееся горение займёт 15 минут; всего прошло 45 минут.'],example:'60 минут с двух концов = 30 минут. Остаток второго шнура: 30 минут с двух концов = 15 минут. Итого 45.'},
  c1_bridge:{title:'Оптимизировать переходы через мост',plain:'Каждый рейс с фонарём требует обратных переходов. Поэтому нужно считать всё путешествие целиком, а не только время, за которое перейдут самые медленные. Для четырёх человек сравни две схемы перевозки медленных.',steps:['Отсортируй времена от самого быстрого к медленному.','Схема A: двое быстрых переходят, быстрый возвращается, двое медленных переходят, второй быстрый возвращается, быстрые переходят снова.','Схема B: быстрый сопровождает каждого из двух медленных по очереди.','Посчитай все переходы и возвраты в обеих схемах.','Выбери меньшую сумму и проверь, что фонарь всегда с нужной группой.'],example:'Времена 1, 2, 5, 10: схема A = 2+1+10+2+2 = 17 минут; схема B = 10+1+5+1+2 = 19. Выбираем 17.'},
  c1_race:{title:'Найти трёх лучших без секундомера',plain:'Без секундомера забег показывает только порядок финиша внутри своей группы. Нельзя сравнить время лошадей из разных забегов напрямую. Сначала получи локальный порядок, затем используй забеги победителей, чтобы убрать заведомо медленных.',steps:['Раздели лошадей на группы по вместимости дорожки.','Проведи забеги групп и запиши порядок в каждой.','Проведи забег победителей: он упорядочит группы.','Отбрось лошадей, которые уже не могут попасть в тройку.','Сравни оставшихся кандидатов финальным забегом.'],example:'25 лошадей по 5: 5 групповых забегов, затем забег 5 победителей. После него можно исключить целые группы и оставить кандидатов на места 2–3 для седьмого забега.'},
  c1_binary:{title:'Закодировать номер несколькими сигналами',plain:'Каждый тестовый датчик отвечает только «да» или «нет». Один датчик не указывает на одну бутылку; он проверяет признак, который встречается у многих. Набор ответов нескольких датчиков становится уникальным кодом.',steps:['Проверь, сколько разных сигналов дают k датчиков: 2^k.','Пронумеруй бутылки и запиши номера двоичным кодом.','Назначь один датчик каждому разряду кода.','В датчик добавь пробы бутылок, у которых этот разряд равен 1.','После одного раунда прочитай комбинацию сигналов как номер.'],example:'3 датчика дают 8 комбинаций: 000–111. Этого достаточно, чтобы различить до 8 бутылок за один раунд.'},
  c1_egg:{title:'Искать этаж убывающими шагами',plain:'С двумя предметами нельзя просто проверять каждый этаж сверху вниз: это может занять слишком много бросков. Первый предмет ищет грубую границу большими шагами; если разбился, второй проверяет пропущенный промежуток по одному.',steps:['Найди минимальное k, для которого 1+2+…+k не меньше числа этажей.','Первый бросок сделай с этажа k.','Если цел, поднимись на k−1 этажей; затем на k−2 и так далее.','Если предмет разбился, вторым проверь этажи в последнем промежутке по одному.','Объясни, что каждый худший случай укладывается в k бросков.'],example:'Для 100 этажей k=14, потому что 14+13+…+1=105. Бросай с этажей 14, 27, 39, 50… Если на 50-м предмет разбился, вторым проверь 40–49.'},
  c1_river:{title:'Перевезти конфликтующие пары',plain:'На берегах нельзя оставлять волка с козой или козу с капустой без человека. Значит, коза — особый предмет: она конфликтует с обоими и её иногда приходится перевозить обратно.',steps:['Запиши запрещённые пары, которые нельзя оставить без присмотра.','Найди пассажира, конфликтующего с обеими сторонами.','Перевези его первым, чтобы не оставить опасную пару.','Возвращай его, когда следующий рейс оставил бы конфликт.','Проверяй оба берега после каждого хода.'],example:'Козу везут первой и возвращают после перевозки волка; затем везут капусту и в конце снова козу.'},
  c1_doors:{title:'Понять задачу о 100 дверях',plain:'Дверь меняет состояние на каждом проходе, номер которого делит номер двери. Большинство делителей образуют пары. Только у квадратов одна пара совпадает, поэтому у них нечётное количество переключений.',steps:['Для номера двери перечисли его делители.','Каждый делитель означает одно переключение.','Парные делители дают чётное число переключений и возвращают дверь в закрытое состояние.','У полного квадрата есть один непарный корень, значит переключений нечётное число.','Посчитай квадраты, не превосходящие число дверей.'],example:'До 100 открыты двери 1², 2², …, 10²: всего 10.'},
  pm4_utilization:{title:'Почему ожидание растёт при высокой загрузке',plain:'Если один исполнитель почти всё время занят, даже маленький сбой или скачок входящих задач создаёт ожидание. Формула ρ/(1−ρ) — это учебная модель одной очереди и одного исполнителя: она оценивает среднее число задач во всей системе, включая ту, что сейчас обслуживается. Это не универсальная формула для любого проекта.',steps:['Переведи загрузку в долю: 80% = 0,8.','Найди свободную долю: 1 − 0,8 = 0,2.','Подставь в данную модель: 0,8 / 0,2 = 4 задачи в системе в среднем.','Вслух оговори условие: один исполнитель, одна очередь, упрощённая модель.','Не называй эти четыре задачи четырьмя ожидающими: в числе есть и задача в работе.'],example:{q:'По учебной модели одной очереди загрузка исполнителя 80%. Каково среднее число задач в системе по формуле ρ/(1−ρ)?',a:['Загрузка 80% записывается как 0,8.','Свободная доля: 1 − 0,8 = 0,2.','0,8 / 0,2 = 4 задачи во всей системе в среднем. Это не универсальный прогноз и не число только ожидающих задач.']},say:'Если используем формулу очереди, я сначала назову модель и уточню, считает ли она задачи в ожидании или во всей системе.',check:['Загрузка переведена в долю?','Названы условия модели?','Не смешаны задачи в очереди и задачи во всей системе?']},
  pm9_pv:{title:'Приведённая стоимость потока',plain:'Деньги, которые придут позже, стоят меньше сегодняшних: их можно было бы вложить под ставку капитала. Поэтому будущий поток не уменьшают на проценты, а делят на множитель (1 + ставка).',steps:['Назови ставку дисконтирования и откуда она взялась.','Построй множитель: 1 + ставка в долях.','Раздели будущий поток на множитель в степени номера года.','Скажи единицу ответа и сравни с номиналом.'],example:'1 млн через год при 10%: 1 000 / 1,10 = 909,1k — это и есть сегодняшняя ценность потока.'},
  pm9_npv:{title:'NPV с эффектом через год',plain:'NPV отвечает на вопрос «сколько ценности проект создаёт сегодня». Инвестиция тратится сегодня и не дисконтируется, а эффект через год сначала приводится к сегодняшней стоимости.',steps:['Выпиши инвестицию, эффект по годам и ставку.','Приведи эффект: сумма / (1 + ставка)^год.','Вычти инвестицию из суммы приведённых эффектов.','Положительный NPV назови вместе со ставкой, при которой он посчитан.'],example:'Инвестиция 900k, эффект 1 100k через год, ставка 10%: 1 100 / 1,10 = 1 000; NPV = 1 000 − 900 = +100k.'},
  pm9_rate:{title:'Сборка ставки дисконтирования',plain:'Ставка не берётся из воздуха: финансы дают базовую стоимость капитала, а риск конкретного проекта добавляется премией. Рискованный проект должен дисконтироваться по более высокой ставке.',steps:['Найди в условии базовую ставку капитала.','Найди премию за риск именно этого проекта.','Сложи их и назови итоговую ставку.','Проверь: зависимость от поставщика и срок — аргументы за более высокую премию.'],example:'Базовая ставка 6%, премия за риск 4%: проект дисконтируется по 10%.'},
  pm9_breakeven:{title:'Ставка при нулевом NPV',plain:'NPV становится нулевым, когда приведённый эффект в точности покрывает инвестицию. Из этого равенства можно найти ставку — это граница, выше которой проект уже не создаёт ценность.',steps:['Запиши равенство: приведённый поток = инвестиция.','Подставь потоки: эффект / (1 + r) = инвестиция.','Вырази r и назови ответ в процентах.','Скажи, что ставка выше этой границы делает проект убыточным по ценности.'],example:'Инвестиция 1 000k, возврат 1 120k через год: 1 120 / (1 + r) = 1 000 → r = 12%.'},
  b3_capacity_adjustment:{title:'Оставить мощность команды после текущей работы',plain:'Сначала найди, сколько работы команда вообще может выполнить за этот срок. Потом убери ту долю времени, которая уже занята обязанностями. Остаток — и есть ресурс для нового проекта.',steps:['Умножь число специалистов на число недель: получишь общую мощность.','Вычти занятый процент из 100%.','Умножь общую мощность на оставшуюся долю.','Назови ответ в человеко-неделях и проверь, что он меньше полной мощности.'],example:{q:'В команде 4 человека на 5 недель. Текущие обязанности займут 25% времени. Сколько останется проекту?',a:['Вся мощность: 4 × 5 = 20 человеко-недель.','Свободно 100% − 25% = 75% времени.','20 × 0,75 = 15 человеко-недель на проект.']}},
  b3_resource_gap:{title:'Посчитать нехватку людей на проект',plain:'Сравни объём работы, который нужен проекту, с тем, сколько команда успеет сделать. Если команде хватает времени, нехватки нет. Если не хватает, разница и есть дефицит ресурса.',steps:['Умножь число людей на число недель: это доступная мощность.','Сравни её с нужным проекту объёмом работы.','Из нужного объёма вычти доступный.','Если получилось меньше нуля, введи 0: нехватки нет.'],example:{q:'Проекту нужны 30 человеко-недель. Четыре человека доступны на 6 недель. Какова нехватка?',a:['Команда может дать 4 × 6 = 24 человеко-недели.','Нужно 30, доступно 24.','30 − 24 = 6 человеко-недель нехватки.']}},
  l1_second_difference:{title:'Найти, как меняются шаги ряда',plain:'Сначала найди расстояние между соседними числами. Если сами эти расстояния растут по правилу, продолжи правило для расстояний, а не гадай следующее число.',steps:['Вычти каждое число из следующего и выпиши шаги.','Проверь, как меняются сами шаги.','Продолжи правило шагов ещё на один шаг.','Прибавь новый шаг к последнему числу ряда.'],example:{q:'Продолжи ряд: 2, 5, 10, 17, ?',a:['Шаги: +3, +5, +7.','Каждый шаг увеличивается на 2, значит следующий — +9.','17 + 9 = 26.']}},
  l1_interleaved:{title:'Разделить ряд на два ряда',plain:'Иногда в одном списке перемешаны два простых ряда. Смотри отдельно на числа на нечётных местах и на числа на чётных местах.',steps:['Пронумеруй места: первое, второе, третье и так далее.','Выпиши числа на нечётных местах в отдельный ряд.','Выпиши числа на чётных местах отдельно.','Найди правило для каждого ряда и ответь для нужного места.'],example:{q:'Продолжи ряд: 4, 30, 7, 27, 10, ?',a:['Нечётные места: 4, 7, 10 — каждый раз +3.','Чётные места: 30, 27, ? — каждый раз −3.','Ответ: 24.']}},

function skillGuide(skill){
  if(SKILL_GUIDES[skill])return SKILL_GUIDES[skill];
  var q=null;
  for(var i=0;i<ALLQ.length;i++)if(ALLQ[i].skill===skill){q=ALLQ[i];break;}

  if(q&&q.kind==='open'&&q.model&&q.model.length)example={q:q.t,a:q.model};

/* вес типа для тренировки: слабые темы получают больше слотов */
function typeWeight(t){
  var s=tStat(t),seen=s.ok+s.bad;
  var err=seen?(s.bad/seen):0.5;
  var mastery=s.total?(s.ok/s.total):0;
  return 0.35+(1-mastery)+err*0.8;
}
function skillWeightMap(){
  var stats={},weights={},calcMisses=0;
  ALLQ.forEach(function(q){
    var s=ST.q[q.id];
    if(s&&s.cause==='calculation')calcMisses++;
    if(!q.skill)return;
    if(!stats[q.skill])stats[q.skill]={total:0,seen:0,mastered:0,missed:0,cause:0};
    var x=stats[q.skill];x.total++;
    if(s){x.seen++;if((s.lv||0)>=1&&s.s==='ok')x.mastered++;if(s.first===false||s.s==='bad')x.missed++;if(s.cause)x.cause++;}
  });
  Object.keys(stats).forEach(function(skill){
    var x=stats[skill],mastery=x.total?x.mastered/x.total:0,err=x.seen?x.missed/x.seen:0.35;
    weights[skill]=0.4+(1-mastery)+err*0.8+Math.min(0.5,x.cause*0.12);
  });
  return{bySkill:weights,calculationMisses:calcMisses};
}
function gStat(){var o=0,m=0,b=0;ALLQ.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q))b++;});return{ok:o,m:m,bad:b,total:TOTALQ};}
function badList(){return ALLQ.filter(isBad);}
function skillList(q){
  if(!q||!q.skill)return [];
  return ALLQ.filter(function(x){return x.skill===q.skill&&x.id!==q.id;}).sort(function(a,b){
    var sa=ST.q[a.id],sb=ST.q[b.id];
    return (sa&&sa.s==='bad'?0:1)-(sb&&sb.s==='bad'?0:1)||(a.level||1)-(b.level||1)||a._i-b._i;
  }).slice(0,6);
}
function dayKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayN(){var k=dayKey(new Date());return (ST.today&&ST.today.d===k)?(ST.today.n||0):0;}
function bumpToday(){var k=dayKey(new Date());
  if(!ST.today||ST.today.d!==k)ST.today={d:k,n:0};ST.today.n++;save();}
function record(q,ok,ms,skipped,noHint){
  var s=ST.q[q.id]||{tries:0};
  var firstTry=s.first===undefined||s.first===null;
  s.tries=(s.tries||0)+1;
  s.s=ok?'ok':'bad';s.ms=ms||0;s.ts=Date.now();
  if(skipped)s.sk=(s.sk||0)+1;
  var clean=!!ok&&!skipped&&!!noHint;
  if(firstTry)s.first=clean;
  if(clean)s.lv=Math.min((s.lv||0)+1,INT.length);else s.lv=0;
  s.due=dayNum()+(clean?INT[s.lv-1]:1);
  ST.q[q.id]=s;bumpToday();save();
}
function markDay(){var k=dayKey(new Date());if(ST.days.indexOf(k)<0){ST.days.push(k);save();}}
function streak(){var set={};ST.days.forEach(function(d){set[d]=1;});
  var n=0,d=new Date();while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function checkNum(q,raw){
  var rs=readings(raw);
  if(!rs.length)return{invalid:true};
  var cand=candidates(q);
  var baseTol=(q.tol!==undefined&&q.tol!==null)?q.tol:Math.max(Math.abs(q.a)*0.015,0.01);
  /* если человек округлил корректно, принимаем округление: «31» для 31,25 проходит,
     а «1» для 0,8 — нет, потому что шаг округления слишком грубый относительно величины */
  var step=0.5*Math.pow(10,-decimalsTyped(raw));
  for(var i=0;i<cand.length;i++){
    var c=cand[i];
    var tol=Math.max(baseTol,baseTol/Math.max(Math.abs(q.a),1e-9)*Math.abs(c));
    var roundTol=(step<=Math.max(tol,0.05*Math.abs(c)))?step:0;
    for(var j=0;j<rs.length;j++){if(Math.abs(rs[j]-c)<=tol+roundTol)return{ok:true,v:rs[j]};}
  }
  return{ok:false,v:rs[0]};
}

function learnCard(t){
  var k=KNOWLEDGE[t.id];
  if(!k)return '';
  var h='<section class="learn" aria-label="Объяснение темы">';
  h+='<div class="learn-kicker">С нуля, на пальцах</div><h3>'+esc(t.title)+'</h3>';
  h+='<p class="learn-plain">'+esc(k.plain)+'</p>';
  if(k.cue)h+='<div class="learn-label">Как понять, что это такая задача</div><div class="learn-cue">'+esc(k.cue)+'</div>';
  if(k.steps&&k.steps.length)h+='<div class="learn-label">Что делать по шагам</div><ol class="learn-list">'
    +k.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(k.example)h+='<div class="learn-label">Мини-пример с разбором</div><div class="learn-example"><div class="exq">'+esc(k.example.q)+'</div><ol>'
    +k.example.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(k.say)h+='<div class="learn-label">Фраза, которую можно сказать на интервью</div><div class="learn-voice">'+esc(k.say)+'</div>';
  if(k.check&&k.check.length)h+='<div class="learn-label">Быстрая самопроверка</div><ul class="learn-check">'
    +k.check.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(k.hacks&&k.hacks.length)h+='<div class="learn-label">Хаки · '+k.hacks.length+'</div><div class="hacks">'
    +k.hacks.map(function(x){return '<div class="hack"><div class="hn">'+esc(x.name)+'</div><div class="hh">'+esc(x.how)+'</div>'+(x.ex?'<div class="hx">'+esc(x.ex)+'</div>':'')+'</div>';}).join('')+'</div>';
  if(k.lessonScript&&k.lessonScript.length)h+='<div class="learn-label">Сценарий по минутам</div>'+k.lessonScript.map(function(b){return '<div class="lesson-blk"><div class="lb-t">'+esc(b.t)+'</div><ol>'+b.lines.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';}).join('');
  if(k.pairs&&k.pairs.length)h+='<div class="learn-label">Пары: одна буква меняет смысл</div><div class="pairs">'+k.pairs.map(function(p){return '<div class="pair">'+wordCell(p.a,'с ع — горло сжато')+wordCell(p.b,'обычное «а»')+'</div>';}).join('')+'</div>';
  if(k.words&&k.words.length)h+='<div class="learn-label">Слова для Дубая</div><div class="pairs">'+k.words.map(function(w){return '<div class="pair one">'+wordCell(w,w.note)+'</div>';}).join('')+'</div>';
  if(k.deep&&k.deep.length)h+='<div class="learn-label">Глубже и как тренировать</div><ul class="learn-deep">'
    +k.deep.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  h+='</section>';
  return h;
}
function viewType(){
  var t=TBY[typeId],s=tStat(t),m=t._m;
  var pct=s.total?Math.round(s.m/s.total*100):0;
  var h='<div class="wrap" style="'+accentStyle(m)+'">';
  h+='<div class="thero"><span class="bd">'+esc(t.num)+'</span>'
   +'<h2>'+esc(t.title)+'</h2>'
   +'<div class="sub">Решено '+s.ok+' из '+s.total+' · с первой попытки '+s.m+(s.bad?' · на повтор '+s.bad:'')+'</div>'
   +'<div class="track"><i style="width:'+pct+'%"></i></div></div>';
  h+=learnCard(t);
  var ls=levelStat(t);h+='<div class="level-strip" aria-label="Прогресс по уровням">'+ls.map(function(x,i){return '<div class="level-pill"><b>'+ (i+1) +'</b><span>'+x.done+'/'+x.all+'</span><i>пройдено</i></div>';}).join('')+'</div>';
  h+='<div class="route-note"><b>Маршрут обучения:</b> сначала простые задачи, затем обратные, многошаговые и с ловушками. Так ты тренируешь не память на один шаблон, а узнавание приёма в новой формулировке.</div>';
  var nl=nextLevel(t)||5,nls=ls[nl-1],complete=nls.done===nls.all;
  h+='<button class="btn" onclick="A.startLevel(\''+t.id+'\','+nl+')">'+(complete?'Повторить':'Продолжить')+' уровень '+nl+' · '+(complete?nls.all:(nls.all-nls.done))+' задач</button>';
  h+='<div style="margin-top:10px"><button class="btn sec" onclick="A.start(\''+t.id+'\')">Весь маршрут · '+t.qs.length+'</button></div>';
  h+='<div style="margin-top:10px">'+(s.bad>0
     ?'<button class="btn sec" onclick="A.startBad(\''+t.id+'\')">Только ошибки · '+s.bad+'</button>'
     :'<button class="btn sec" onclick="A.startShuffle(\''+t.id+'\')">Вперемешку</button>')+'</div>';
  h+='<div class="acc'+(accTheory?' open':'')+'"><button class="ah" aria-expanded="'+(accTheory?'true':'false')+'" aria-controls="type-reference" onclick="A.theory()">'
   +'<span>Шпаргалка и формулы</span><span class="chev">›</span></button><div class="ab" id="type-reference">';
  h+='<div class="sh">Что проверяют</div><p class="sp">'+esc(t.why)+'</p>';
  h+='<div class="sh">Как решать</div><ol class="steps">'
   +t.method.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(t.formulas&&t.formulas.length)h+='<div class="sh">Формулы</div><p class="formula-note">Формула — короткая запись уже объяснённой мысли. Буквы заменяются числами из условия; × означает «умножить», / — «разделить», Σ — «сложить все части». Сначала пойми пример, потом запоминай формулу.</p>'
   +t.formulas.map(function(x){return '<div class="fml" aria-label="Формула">'+formulaHtml(x)+'</div>';}).join('');
  if(t.example)h+='<div class="sh">Разобранный пример</div><div class="exbox"><div class="exq">'
   +esc(t.example.q)+'</div><ol>'+t.example.sol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(t.traps&&t.traps.length)h+='<div class="sh">Частые ошибки</div><ul class="warns">'
   +t.traps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  h+='<div class="sh">Норматив</div><p class="sp">'+esc(t.perf||'')+'</p></div></div>';
  h+='<div class="sh">Задачи</div><div class="chips">';
  t.qs.forEach(function(q,i){
    var c=isMas(q)?'mas':isBad(q)?'bad':isOk(q)?'ok':'';
    h+='<button class="chip '+c+'" onclick="A.jump(\''+t.id+'\','+i+')">'+(i+1)+'</button>';
  });
  h+='</div>';
  return h+'</div>';
}

/* ---------- focused skill introduction ---------- */

function viewSkillIntro(){
  var p=pendingSkill;if(!p)return '';
  var g=skillGuide(p.skill),h='<div class="wrap mid"><section class="learn" aria-label="Объяснение приёма">';
  h+='<div class="learn-kicker">Сначала поймём, потом посчитаем</div><h3>'+esc(g.title)+'</h3>';
  h+='<p class="learn-plain">'+esc(g.plain)+'</p>';
  h+='<div class="learn-label">Как действовать</div><ol class="learn-list">'+g.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  h+='<div class="learn-label">Мини-пример</div><div class="learn-example">';
  if(typeof g.example==='string')h+='<div class="exq">'+esc(g.example)+'</div>';
  else{h+='<div class="exq">'+esc(g.example.q)+'</div><ol>'+g.example.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';}
  h+='</div>';
  if(g.next&&g.next.length)h+='<div class="learn-label">Как получается короткая формула</div><div class="learn-example"><ol>'+g.next.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  h+='<div class="route-note"><b>В серии '+p.list.length+' задач.</b> Первые будут похожими и простыми. Затем изменятся числа, формулировка или контекст. Твоя цель — объяснять ход, а не угадывать знакомый шаблон.</div>';
  h+='<button class="btn" onclick="A.startSkill()">Начать серию · '+p.list.length+' задач</button>';
  h+='<div style="margin-top:10px"><button class="btn sec" onclick="A.leave()">Вернуться к теме</button></div>';
  return h+'</section></div>';
