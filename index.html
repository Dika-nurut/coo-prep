/* ---------- practice ---------- */
function headPrac(){
  var c=cur();if(!c)return '';
  var prog=Math.round((S.idx+1)/S.list.length*100);
  return '<div class="prow" style="'+accentStyle(c.t._m)+'">'
   +'<button class="xbtn" aria-label="Выйти из тренировки" title="Выйти" onclick="A.leave()">✕</button>'
   +'<div class="track"><i style="width:'+prog+'%"></i></div>'
   +'<span class="pcount">'+(S.idx+1)+'/'+S.list.length+'</span>'
   +'<span class="ptime" id="timer">'+(S.deadline?fmtMs(Math.max(0,S.deadline-Date.now())):'без лимита')+'</span>'
   +'</div>';
}
function viewPrac(){
  var c=cur();if(!c)return '';
  var q=c.q,m=c.t._m,k=KNOWLEDGE[c.t.id],h='';
  h+='<div class="wrap mid" style="'+accentStyle(m)+'"><div class="qwrap">';
  h+='<div class="qlabel">'+(q.kind==='open'?'Свободный ответ':q.kind==='mc'?'Выбери вариант':'Введи ответ')+' · '+esc(LEVEL_NAMES[q.level||1])+'</div>';
  h+='<div class="qtext">'+esc(q.t)+'</div>';
  if(BANK.strategy.order.indexOf(q._t.id)>=0)h+=caseCard(c);
  if(q.table)h+='<div class="tw">'+tableHtml(q.table)+'</div>';
  if(q.kind==='num'){
    h+='<div class="ansbox">'+(S.val?'<span class="v">'+esc(S.val)+'</span>':'<span class="ph">0</span>')
     +(q.unit?'<span class="u">'+esc(q.unit)+'</span>':'')+'</div>';
  } else if(q.kind==='mc'){
    h+='<div style="margin-top:18px">';
    q.opts.forEach(function(o,i){
      var cl='opt';
      if(S.answered){cl+=(i===q.correct?' good':(i===S.pick?' bad':' off'));}
      else if(S.pick===i)cl+=' sel';
      h+='<button class="'+cl+'" onclick="A.pick('+i+')"><span class="l">'
       +String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
  } else {
    if(!S.revealed){
      h+='<textarea class="ta" id="ans" placeholder="Структура, расчёт, рекомендация…" autocorrect="off" spellcheck="false">'+esc(S.val||'')+'</textarea>';
      h+='<div style="margin-top:12px"><button class="btn" style="--acc:var(--blue);--accl:var(--bluel);--on:#FFFFFF" '
       +'onclick="A.reveal()">Сравнить с эталоном</button></div>';
    } else {
      h+=refCard(c);
    }
  }
  if(!S.answered&&!S.revealed){
    if(S.badInput)h+='<div class="tip" style="margin-top:14px">Не разобрал число. Набери цифрами: <b>120000</b>, <b>1,5</b> или коротко <b>120k</b>.</div>';
    if(S.hint)h+='<div class="hintbox">'+esc(q.hint||(BANK.hints&&BANK.hints[q.id])||(q.skill&&SKILL_GUIDES[q.skill]&&SKILL_GUIDES[q.skill].steps[0])||(k&&k.hint)||c.t.method[0])+'</div>';
    h+='<div class="linkrow">';
    if(!S.hint&&S.mode!=='exam')h+='<button class="btn link" onclick="A.hint()">Подсказка</button>';
    if(q.kind!=='open')h+='<button class="btn link" onclick="A.dontKnow()">Не знаю</button>';
    h+='</div>';
  }
  if(S.answered)h+=solCard(c);
  h+='</div></div>';
  return h;
}
function refCard(c){
  var q=c.q,h='<div class="sol"><div class="hd"><span>Эталон</span><span class="ln"></span></div>';
  if(S.val)h+='<p class="sp" style="margin-bottom:10px"><b>Твой ответ:</b> '+esc(S.val)+'</p>';
  if(q.model&&q.model.length)h+='<ol>'+q.model.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.checklist&&q.checklist.length)h+='<div class="hd" style="margin-top:14px"><span>Проверь у себя</span><span class="ln"></span></div><ul>'
   +q.checklist.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(!S.ok)h+=mistakeCard(c);
  return h+'</div>';
}
function caseCard(c){
  var q=c.q,b=BANK.strategy.types[q._t.id],d=q.decode||BANK.strategy.decode[q.id];
  var h='<section class="strategy-card" aria-label="Разбор кейса">';
  if(d)h+='<div class="learn-label">Конкретно в этой задаче</div><div class="learn-plain">'+esc(d)+'</div>';
  h+='<div class="learn-label">Сцена</div><p class="sp">'+esc(b.situation)+'</p>';
  h+='<div class="learn-label">Что спрашивает COO</div><p class="sp">'+esc(b.ask)+'</p>';
  h+='<div class="learn-label">Что проверяют</div><ul>'+b.checks.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  h+='<div class="learn-label">Каркас ответа</div><ol>'+b.frame.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  h+='<div class="learn-label">Пример сильного ответа</div><ol>'+b.sample.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  h+='<div class="strategy-note">'+esc(BANK.strategy.note)+'</div></section>';
  return h;
}
function mistakeCard(c){
  var q=c.q,h='<div class="mistake"><div class="mt">Почему ответ не засчитан</div>';
  if(S.skipped){
    h+='<p><b>Ты пропустил задачу.</b> Это не ошибка характера: сейчас важнее увидеть решение, назвать приём вслух и вернуть задачу на повтор.</p>';
  }else if(q.kind==='num'){
    h+='<p>Ты ввёл <b>'+esc(S.user||'—')+'</b>, а правильный ориентир — <b>'+fmt(q.a)+(q.unit?' '+esc(q.unit):'')+'</b>.</p>';
  }else if(q.kind==='mc'){
    h+='<p>Ты выбрал <b>'+esc(S.user||'—')+'</b>. Правильный вариант — <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>.</p>';
  }else{
    h+='<p><b>Свободный ответ не проверяется автоматически.</b> Это не оценка «плохой ответ»: ты отметил, что пока не уверен. Сравни свой текст с эталоном и чек-листом; найди первый пункт, которого в твоём ответе не хватает. Именно его и повтори в следующей попытке.</p>';
  }
  if(q.skill){
    var sk=String(q.skill).replace(/[^a-zA-Z0-9_:-]/g,'');
    h+='<p><b>Что сейчас тренируем:</b> '+esc(skillLabel(q))+'</p>';
    if(skillList(q).length)h+='<button class="btn sec" style="margin-top:10px" onclick="A.skill(\''+sk+'\')">Закрепить этот приём · '+skillList(q).length+' задач</button>';
  }
  if(q.trap)h+='<p><b>Типичная ловушка:</b> '+esc(q.trap)+'</p>';
  var cause=ST.q[q.id]&&ST.q[q.id].cause||'';
  h+='<p style="margin-top:12px"><b>Что сбило?</b> Выбери причину, чтобы следующие тренировки лучше подстраивались под тебя.</p>';
  h+='<div class="cause-grid">'
   +[['wording','Не понял условие'],['method','Не знал способ'],['calculation','Знал способ, ошибся в счёте'],['pressure','Растерялся или торопился']].map(function(x){
     return '<button aria-pressed="'+(cause===x[0])+'" onclick="A.markCause(\''+q.id+'\',\''+x[0]+'\')">'+x[1]+'</button>';
   }).join('')+'</div>';
  h+='</div>';
  return h;
}
function solCard(c){
  var q=c.q,h='<div class="sol"><div class="hd"><span>Решение</span><span class="ln"></span></div>';
  if(q.sol&&q.sol.length)h+='<ol>'+q.sol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.explain&&q.explain.length)h+='<div class="deep-explain"><div class="dt">Разберём на пальцах</div><ol>'+q.explain.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(q.after&&q.after.length)h+='<div class="deep-explain"><div class="dt">Теперь короткая запись</div><ol>'+q.after.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(q.kind==='open'&&q.model&&q.model.length)h+='<ol>'+q.model.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.checklist&&q.checklist.length)h+='<div class="hd" style="margin-top:14px"><span>Проверь у себя</span><span class="ln"></span></div><ul>'
   +q.checklist.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(!S.ok)h+=mistakeCard(c);
  return h+'</div>';
}
function ansLine(c){
  var q=c.q;
  var right=fmt(q.a)+(q.unit?' '+esc(q.unit):'');
  if(S.skipped){
    if(q.kind==='num')return 'Верно: <b>'+right+'</b>';
    if(q.kind==='mc')return 'Верно: <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>';
    return 'Задача вернётся на повтор';
  }
  if(q.kind==='num')return S.ok?('Ответ: <b>'+right+'</b>'):('Твой: <b>'+esc(S.user||'—')+'</b> · верно <b>'+right+'</b>');
  if(q.kind==='mc')return 'Верно: <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>';
  return 'Самооценка: '+(S.ok?'справился':'нужно повторить');
}
function footPrac(){
  var c=cur();if(!c)return '';
  var q=c.q;
  if(S.answered){
    var ok=S.ok, skip=!!S.skipped;
    var acc=skip?'var(--warn)':(ok?'var(--ok)':'var(--no)');
    var on=skip?(THEME==='light'?'#FFFFFF':'#131F24'):(ok?'var(--ongreen)':'#FFFFFF');
    return '<div class="fin" style="--acc:'+acc+';--on:'+on+'">'
     +'<div class="fbh"><div class="ic">'+(skip?'!':(ok?'✓':'✕'))+'</div>'
     +'<div class="tx"><div class="t">'+(skip?'Пропущено':(ok?'Верно':'Неверно'))+'</div><div class="a">'+ansLine(c)+'</div></div></div>'
     +'<button class="btn" style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.next()">'
     +(S.idx+1>=S.list.length?'Завершить':'Дальше')+'</button></div>';
  }
  if(q.kind==='num'){
    var keys=['1','2','3','4','5','6','7','8','9',',','0','del'];
    var kp='<div class="kp" style="'+accentStyle(c.t._m)+'">';
    keys.forEach(function(k){
      kp+='<button class="key'+(k==='del'?' del':'')+'" onclick="A.key(\''+k+'\')">'+(k==='del'?'⌫':k)+'</button>';
    });
    kp+='</div>';
    return '<div class="fin">'+kp+'<button class="btn"'+((S.val?'':' disabled'))
     +' style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.check()">Проверить</button></div>';
  }
  if(q.kind==='mc'){
    return '<div class="fin"><button class="btn"'+((S.pick===null||S.pick===undefined)?' disabled':'')
     +' style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.check()">Проверить</button></div>';
  }
  if(S.revealed){
    return '<div class="fin"><div class="btnrow">'
     +'<button class="btn sec" onclick="A.selfBad()">Повторить</button>'
     +'<button class="btn" style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.selfGood()">Справился</button>'
     +'</div></div>';
  }
  return '';
}

/* ---------- summary ---------- */
function headSum(){return '<div class="hrow"><button class="xbtn" aria-label="Назад к главной" title="Назад" onclick="A.home()">‹</button>'
  +'<div class="ht">Итог</div></div>';}
function viewSum(){
  if(!S)return '';
  var done=S.done,ok=S.correct,pct=done?Math.round(ok/done*100):0;
  var col=pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--no)';
  var h='<div class="wrap"><div class="sum">';
  h+='<div class="ringwrap">'+ring(pct,col,164)+'<div class="ringtxt"><b>'+pct+'%</b><span>ВЕРНЫХ</span></div></div>';
  h+='<div class="sumline">'+ok+' из '+done+' · '+fmtMs((S.endedAt||Date.now())-S.startedAt)+'</div>';
  h+='<div class="stats" style="margin-top:0"><div><b>'+done+'</b><span>сделано</span></div>'
   +'<div><b class="'+(S.wrong.length?'r':'')+'">'+S.wrong.length+'</b><span>на повтор</span></div>'
   +'<div><b>'+todayN()+'</b><span>за сегодня</span></div></div>';
  h+='</div>';
  h+=sessionVerdict();
  if(S.wrong.length){
    h+='<div class="sh">Разобрать заново</div><div class="wlist">';
    S.wrong.forEach(function(id){
      var q=null;ALLQ.forEach(function(x){if(x.id===id)q=x;});
      if(!q)return;
      var qt=q.t.length>56?q.t.slice(0,56)+'…':q.t;
      h+='<div class="wi" onclick="A.open(\''+q._t.id+'\')"><span class="wig">'+esc(q._t.num)+'</span>'
       +'<span class="wt">'+esc(qt)+'</span></div>';
    });
    h+='</div>';
    h+='<div style="margin-top:12px"><button class="btn" onclick="A.redoWrong()">Повторить ошибочные</button></div>';
  }
  h+='<div style="margin-top:10px"><button class="btn sec" onclick="A.home()">На главную</button></div>';
  return h+'</div>';
}

function sessionVerdict(){
  if(!S||(S.mode!=='blitz'&&S.mode!=='exam'&&S.mode!=='rehearse')||!S.mid)return '';
  var m=modBy(S.mid),h='<div class="verdict">';
  if(S.mode==='rehearse'){
    var used=Math.round(((S.endedAt||Date.now())-S.startedAt)/1000),lim=m.rehearse.sec,tq=TBY[m.rehearse.type],full=null;
    tq.qs.forEach(function(q){if(q.id==='t1_o_full')full=q;});
    h+='<div class="vt">Репетиция · '+fmtMs(used*1000)+' из '+fmtMs(lim*1000)+'</div>';
    h+='<p>'+(used<=lim?'Уложился. ':'Не уложился — сократи историю до 45 секунд. ')+'Теперь проведи урок целиком вслух и на видео, затем отметь по чек-листу:</p>';
    if(full)h+='<ul class="learn-check">'+full.checklist.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    return h+'</div>';
  }
  if(S.mode==='blitz'){
    var avg=S.done?((S.endedAt-S.startedAt)/1000/S.done):0;
    h+='<div class="vt">Блиц · '+esc(m.title)+'</div>';
    h+='<p>Верно <b>'+S.correct+'</b> за '+Math.round(m.blitz.sec/60)+' мин · в среднем <b>'+(Math.round(avg*10)/10).toString().replace('.',',')+' с</b> на задачу.</p>';
    h+='<p>'+(S.record?'Новый рекорд. ':'Рекорд: '+ST.best[S.mid].ok+'. ')+'Ориентир к встрече: 20+ верных за 2 минуты при точности выше 90%.</p>';
    return h+'</div>';
  }
  var by={};S.res.forEach(function(r){var b=by[r.tid]||(by[r.tid]={n:0,ok:0,ms:0});b.n++;if(r.ok)b.ok++;b.ms+=r.ms;});
  var pct=S.done?Math.round(S.correct/S.done*100):0,pass=pct>=m.exam.pass;
  h+='<div class="vt">'+(pass?'Модуль закрыт':'Пока не закрыт')+' · порог '+m.exam.pass+'%</div>';
  h+='<div class="vrows">';
  m.types.forEach(function(t){var b=by[t.id];if(!b)return;var p=Math.round(b.ok/b.n*100),sec=Math.round(b.ms/b.n/1000);
    h+='<button class="vrow'+(p<m.exam.pass?' weak':'')+'" onclick="A.open(\''+t.id+'\')"><span class="vn">'+esc(t.num)+'</span><span class="vl">'+esc(t.title)+'</span><span class="vp">'+b.ok+'/'+b.n+' · '+sec+' с</span></button>';});
  h+='</div>';
  h+='<p>'+(pass?'Ты решаешь этот тип задач уверенно и без подсказок. Дальше поддерживай форму блицем раз в день.':'Открой темы, отмеченные красным, пройди их уровни 3–5 и повтори контрольную. Засчитывается результат без подсказок.')+'</p>';
  return h+'</div>';
}

/* ---------- actions ---------- */
window.A={
  home:function(){screen='home';S=null;render();},
  open:function(id){typeId=id;screen='type';accTheory=false;S=null;render();},
  strategyIntro:function(){S=null;typeId=null;screen='strategyIntro';render();},
  strategy:function(){A.run(strategyList().map(function(q){return{tid:q._t.id,qi:q._i};}),'strategy');},
  theory:function(){accTheory=!accTheory;if(accTheory&&typeId){ST.theory[typeId]=1;save();}render();},
  proto:function(){accProto=!accProto;render();},
  theme:function(){
    THEME=(THEME==='light')?'dark':'light';ST.theme=THEME;save();
    document.documentElement.setAttribute('data-theme',THEME);
    var mt=document.querySelector('meta[name=theme-color]');
    if(mt)mt.setAttribute('content',THEME==='light'?'#FFFFFF':'#131F24');
    render();
  },
  reset:function(){if(confirm('Сбросить весь прогресс?')){ST={q:{},theory:{},days:[],today:null,theme:THEME,best:{},exam:{}};save();render();}},
  start:function(id){var t=TBY[id];A.run(routeFor(t),'type');},
  startLevel:function(id,level){var t=TBY[id];var list=t.qs.map(function(q,i){return{tid:id,qi:i};}).filter(function(x){return(t.qs[x.qi].level||1)===level;});A.run(list,'level');},
  startShuffle:function(id){var t=TBY[id];A.run(shuffle(t.qs.map(function(q,i){return{tid:id,qi:i};})),'type');},
  startBad:function(id){var t=TBY[id];
    A.run(t.qs.map(function(q,i){return{tid:id,qi:i};}).filter(function(x){return isBad(t.qs[x.qi]);}),'type');},
  skill:function(skill){
    var list=ALLQ.filter(function(q){return q.skill===skill;}).sort(function(a,b){
      var sa=ST.q[a.id],sb=ST.q[b.id];
      return (sa&&sa.s==='bad'?0:1)-(sb&&sb.s==='bad'?0:1)||(a.level||1)-(b.level||1)||a._i-b._i;
    }).slice(0,6);
    if(list.length){pendingSkill={skill:skill,list:list.map(function(q){return{tid:q._t.id,qi:q._i};})};S=null;screen='skillIntro';render();}
  },
  startSkill:function(){if(!pendingSkill)return;var p=pendingSkill;pendingSkill=null;A.run(p.list,'skill');},
  jump:function(id,i){var t=TBY[id];A.run(t.qs.map(function(q,j){return{tid:id,qi:j};}),'type',i);},
  run:function(list,mode,startAt,withClock){
    if(!list.length)return;
    S={list:list,idx:startAt||0,mode:mode,answered:false,ok:null,user:'',pick:null,val:'',hint:false,revealed:false,
       skipped:false,badInput:false,done:0,correct:0,wrong:[],res:[],startedAt:Date.now(),taskStart:Date.now(),endedAt:null,
       deadline:(mode==='drill'&&withClock)?Date.now()+20*60*1000:null};
    screen='practice';render();
  },
  /* репетиция урока: ключевые части сценария подряд, общий таймер */
  rehearse:function(mid){
    var m=modBy(mid);if(!m||!m.rehearse)return;var t=TBY[m.rehearse.type];if(!t)return;
    var list=[];m.rehearse.ids.forEach(function(id){t.qs.forEach(function(q,i){if(q.id===id)list.push({tid:t.id,qi:i});});});
    A.run(list,'rehearse');if(!S)return;S.mid=mid;S.deadline=Date.now()+m.rehearse.sec*1000;render();
  },
  say:function(text){
    if(!CAN_SAY)return;
    try{var u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=0.7;
      var v=speechSynthesis.getVoices().filter(function(x){return /^ar/i.test(x.lang);})[0];if(v)u.voice=v;
      speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
  },
  blitz:function(mid){
    var m=modBy(mid);if(!m||!m.blitz)return;
    var pool=[];m.types.forEach(function(t){t.qs.forEach(function(q,i){if(q.kind!=='open'&&(q.level||1)<=m.blitz.maxLevel)pool.push({tid:t.id,qi:i});});});
    A.run(shuffle(pool).slice(0,80),'blitz');if(!S)return;S.mid=mid;S.deadline=Date.now()+m.blitz.sec*1000;render();
  },
  /* контрольная: поровну задач из каждой темы модуля, без подсказок */
  exam:function(mid){
    var m=modBy(mid);if(!m||!m.exam)return;
    var per=Math.ceil(m.exam.n/m.types.length),list=[];
    m.types.forEach(function(t){
      var c=t.qs.map(function(q,i){return{tid:t.id,qi:i};}).filter(function(x){var q=t.qs[x.qi];return q.kind!=='open'&&(q.level||1)>=m.exam.minLevel;});
      list=list.concat(shuffle(c).slice(0,per));
    });
    A.run(shuffle(list).slice(0,m.exam.n),'exam');if(S)S.mid=mid;
  },
  retry:function(){var b=badList();if(!b.length)return;
    A.run(shuffle(b.map(function(q){return{tid:q._t.id,qi:q._i};})),'type');},
  /* повтор по расписанию: сначала самые просроченные */
  review:function(){
    var d=dueList();
    if(!d.length)return;
    A.run(d.slice(0,20).map(function(q){return{tid:q._t.id,qi:q._i};}),'review');
  },
  redoWrong:function(){if(!S||!S.wrong.length)return;var l=[];
    S.wrong.forEach(function(id){ALLQ.forEach(function(q){if(q.id===id)l.push({tid:q._t.id,qi:q._i});});});
    A.run(l,'type');},
  drill:function(timed){
    /* Три очереди: к повтору сейчас, ни разу не решённые, остальные.
       Внутри очереди выбор взвешен по слабости темы, поэтому один тип
       может получить несколько слотов, а сильные темы почти не мешают. */
    var tiers=[[],[],[]],skillWeights=skillWeightMap(),typeWeights={},frontiers={};
    TYPES.forEach(function(t){typeWeights[t.id]=typeWeight(t);frontiers[t.id]=nextLevel(t)||5;});
    ALLQ.forEach(function(q){
      var s=ST.q[q.id];
      var tier=isDue(q)?0:(s?2:1);
      if(tier!==0&&(q.level||1)>frontiers[q._t.id])return;
      var w=typeWeights[q._t.id]*(skillWeights.bySkill[q.skill]||1);
      if(q._t.id==='m0'&&skillWeights.calculationMisses)w*=1+Math.min(2,skillWeights.calculationMisses*0.25);
      tiers[tier].push({q:q,w:w});
    });
    var pick=[],cnt={},used={},CAP=3;
    function take(arr,limit){
      var pool=arr.slice();
      while(pick.length<limit&&pool.length){
        var total=0,i;
        for(i=0;i<pool.length;i++)total+=pool[i].w;
        var r=Math.random()*total,acc=0,idx=0;
        for(i=0;i<pool.length;i++){acc+=pool[i].w;if(acc>=r){idx=i;break;}}
        var c=pool.splice(idx,1)[0];
        var tid=c.q._t.id;
        if(used[c.q.id]||(cnt[tid]||0)>=CAP)continue;
        used[c.q.id]=1;pick.push(c.q);cnt[tid]=(cnt[tid]||0)+1;
      }
    }
    take(tiers[0],6);        /* не больше шести повторов, чтобы тренировка осталась миксом */
    take(tiers[1],DAILY);
    take(tiers[2],DAILY);
    if(pick.length<DAILY)take(tiers[0],DAILY);   /* всё слабое — добираем из очереди повтора */
    if(!pick.length)return;
    shuffle(pick);
    A.run(pick.map(function(q){return{tid:q._t.id,qi:q._i};}),'drill',0,!!timed);
  },
  markCause:function(qid,cause){
    var s=ST.q[qid];if(!s)return;
    s.cause=cause;ST.q[qid]=s;save();render();
  },
  leave:function(){var fromStrategy=!!(S&&S.mode==='strategy');S=null;if(fromStrategy)typeId=null;screen=(!fromStrategy&&typeId)?'type':'home';render();},
  hint:function(){if(!S)return;var el=document.getElementById('ans');
    if(el&&el.value!==undefined)S.val=el.value;S.hint=true;render();},
  key:function(k){
    if(!S||S.answered)return;
    var v=S.val||'';
    if(k==='del')v=v.slice(0,-1);
    else if(k===','){if(v.indexOf(',')<0&&v.indexOf('.')<0)v=v+',';}
    else if(v.length<14)v=v+k;
    S.val=v;S.badInput=false;render();
  },
  pick:function(i){if(!S||S.answered)return;S.pick=(S.pick===i?null:i);render();},
  check:function(){
    var c=cur();if(!c||S.answered)return;
    if(c.q.kind==='num'){
      if(!S.val)return;
      var r=checkNum(c.q,S.val);
      if(r.invalid){S.badInput=true;render();return;}
      A.finish(!!r.ok,S.val);
    } else if(c.q.kind==='mc'){
      if(S.pick===null||S.pick===undefined)return;
      A.finish(S.pick===c.q.correct,String.fromCharCode(65+S.pick)+'. '+c.q.opts[S.pick]);
    }
  },
  /* «не знаю» — честный сигнал вместо угадывания: показываем решение, задача уходит в повтор */
  dontKnow:function(){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=false;S.user='';S.skipped=true;S.badInput=false;
    record(c.q,false,Date.now()-S.taskStart,true,false);
    S.done++;S.wrong.push(c.q.id);S.res.push({tid:c.t.id,ok:false,ms:Date.now()-S.taskStart});
    render();
  },
  reveal:function(){var el=document.getElementById('ans');if(el&&S)S.val=el.value;if(S)S.revealed=true;render();},
  selfGood:function(){A.finish(true,S.val);},
  selfBad:function(){A.finish(false,S.val);},
  finish:function(ok,user){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=ok;S.user=user||'';S.skipped=false;S.badInput=false;
    record(c.q,ok,Date.now()-S.taskStart,false,!S.hint);
    S.done++;if(ok)S.correct++;else S.wrong.push(c.q.id);
    S.res.push({tid:c.t.id,ok:!!ok,ms:Date.now()-S.taskStart});
    render();
    /* в блице верный ответ сразу ведёт дальше: темп важнее разбора */
    if(ok&&S.mode==='blitz'){var at=S.idx;setTimeout(function(){if(S&&S.mode==='blitz'&&S.answered&&S.idx===at&&screen==='practice')A.next();},450);}
  },
  next:function(){
    if(!S)return;
    if(S.idx+1>=S.list.length){endSession();return;}
    S.idx++;S.answered=false;S.ok=null;S.user='';S.pick=null;S.val='';S.hint=false;S.revealed=false;
    S.skipped=false;S.badInput=false;S.taskStart=Date.now();
    render();
  }
};

document.addEventListener('keydown',function(e){
  if(screen!=='practice'||!S)return;
  var c=cur();if(!c)return;
  if(!S.answered&&c.q.kind==='num'&&/^[0-9]$/.test(e.key)){e.preventDefault();A.key(e.key);return;}
  if(!S.answered&&c.q.kind==='num'&&(e.key===','||e.key==='.')){e.preventDefault();A.key(',');return;}
  if(!S.answered&&c.q.kind==='num'&&e.key==='Backspace'){e.preventDefault();A.key('del');return;}
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(!S.answered)A.check(); else A.next();
});

setInterval(function(){
  if(screen!=='practice'||!S)return;
  if(!S.deadline)return;
  var el=document.getElementById('timer');if(!el)return;
  var left=S.deadline-Date.now();
  el.textContent=fmtMs(left);
  el.className='ptime'+(left<60000?' crit':left<300000?' over':'');
  if(left<=0)endSession();
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});
}
render();
})();
</script>
