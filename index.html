<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COO Prep</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="COO Prep">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- tokens: Duolingo light / dark ---------- */
:root{
  --bg:#FFFFFF; --surf:#FFFFFF; --surf2:#F7F7F7; --line:#E5E5E5;
  --ink:#4B4B4B; --ink2:#777777; --ink3:#969BA0;
  --green:#58CC02; --greenl:#58A700; --ongreen:#FFFFFF;
  --blue:#1CB0F6; --bluel:#1899D6; --selbg:#DDF4FF;
  --ok:#58A700; --okbg:#D7FFB8; --okline:#A5ED6E;
  --no:#EA2B2B; --nobg:#FFDFE0; --noline:#FFB2B2;
  --warn:#CD7900; --warnbg:#FFF5D3; --warnline:#FFC800;
}
html[data-theme="dark"]{
  --bg:#131F24; --surf:#202F36; --surf2:#26343B; --line:#37464F;
  --ink:#F1F7FB; --ink2:#AFBEC7; --ink3:#8296A0;
  --green:#93D333; --greenl:#79B933; --ongreen:#131F24;
  --blue:#49C0F8; --bluel:#3AA4D8; --selbg:#1E333D;
  --ok:#93D333; --okbg:#1C3226; --okline:#79B933;
  --no:#EE5555; --nobg:#332124; --noline:#D84848;
  --warn:#FFC800; --warnbg:#2E2712; --warnline:#D79433;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#top{flex:0 0 auto;display:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
#top.on{display:block}
#body{flex:1 1 auto;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#foot{flex:0 0 auto;display:none;background:var(--bg);border-top:2px solid var(--line)}
#foot.on{display:block}
.wrap{width:100%;max-width:620px;margin:0 auto;padding:0 16px}
.wrap.mid{margin:auto}
.fin{width:100%;max-width:620px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.anim{animation:up .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.xbtn{flex:0 0 auto;width:32px;height:32px;border:none;background:none;color:var(--ink3);
  font:800 22px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}
.prow{display:flex;align-items:center;gap:12px}
.track{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{position:relative;display:block;height:100%;border-radius:99px;background:var(--acc,var(--green));
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.track>i:after{content:'';position:absolute;left:6px;right:6px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
.track.sm{height:12px}
.pcount{flex:0 0 auto;font:800 14px/1 inherit;color:var(--ink2);font-variant-numeric:tabular-nums}
.ptime{flex:0 0 auto;min-width:44px;text-align:right;font:800 13px/1 inherit;color:var(--ink3);font-variant-numeric:tabular-nums}
.ptime.over{color:var(--warn)} .ptime.crit{color:var(--no)}
.hrow{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.hrow .ht{flex:1;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- buttons (Duolingo: radius 12, lip 4px, uppercase, .8px) ---------- */
.btn{position:relative;display:block;width:100%;min-height:50px;padding:14px 16px;border:none;border-radius:12px;
  cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:var(--acc,var(--green));color:var(--on,var(--ongreen));
  box-shadow:0 4px 0 var(--accl,var(--greenl));transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accl,var(--greenl))}
.btn[disabled]{background:var(--line);color:var(--ink3);box-shadow:0 4px 0 var(--line);cursor:default}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--line)}
.btn.sec{background:var(--surf);color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  text-transform:none;letter-spacing:0;font-size:14.5px}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn.link{background:none;box-shadow:none;border:none;color:var(--blue);text-transform:none;letter-spacing:0;
  font-size:14px;font-weight:700;min-height:46px}
.btn.link:active{transform:none;opacity:.6}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1;min-width:0}

/* ---------- cards ---------- */
.card{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:15px 16px}
.card.lip{box-shadow:0 4px 0 var(--line)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}

/* ---------- home ---------- */
.brandrow{display:flex;align-items:center;gap:12px;padding:14px 0 18px}
.brand{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.brand-s{font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:2px}
.streak{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:5px;
  background:var(--surf2);border:2px solid var(--line);border-radius:99px;padding:6px 12px}
.streak b{font-size:15px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
.streak span{font-size:11px;font-weight:700;color:var(--ink3)}
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.hero-n{font-size:12px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.hero-txt{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:11px}
.stats{display:flex;margin-top:16px;background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stats>div{flex:1;padding:14px 6px;text-align:center;border-right:2px solid var(--line)}
.stats>div:last-child{border-right:none}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats b.r{color:var(--no)}
.stats span{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:5px}
.mod{margin-top:24px}
.mod-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.mod-dot{width:12px;height:12px;border-radius:4px;background:var(--acc);flex:0 0 auto}
.mod-t{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
.mod-c{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
  padding:12px 13px 13px;transition:transform .07s}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile .num{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;
  background:var(--acc);color:var(--on);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .st{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;color:var(--no)}
.tile .st.ok{color:var(--ok)}
.tile .nm{display:block;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink);margin:8px 0 6px;min-height:35px}
.tile .cnt{display:block;font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.footrow{display:flex;gap:10px;margin-top:26px}
.foot{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);padding:16px 0 4px}

/* ---------- accordion ---------- */
.acc{margin-top:20px;background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:800}
.acc>.ah:active{background:var(--surf2)}
.acc>.ah .chev{margin-left:auto;color:var(--ink3);font-size:16px;transition:transform .2s}
.acc.open>.ah .chev{transform:rotate(90deg)}
.acc>.ab{display:none;padding:4px 16px 16px;border-top:2px solid var(--line)}
.acc.open>.ab{display:block}
.sh{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}
.sh:first-child{margin-top:14px}
.sp{font-size:14px;line-height:1.6;color:var(--ink2);font-weight:500}
.steps{list-style:none;counter-reset:s;padding:0}
.steps li{position:relative;padding-left:32px;margin-bottom:10px;font-size:14px;line-height:1.55;
  counter-increment:s;color:var(--ink2);font-weight:500}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:7px;
  background:var(--acc);color:var(--on);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fml{font:700 13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surf2);
  border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;color:var(--blue);
  overflow-x:auto;white-space:nowrap}
.exbox{background:var(--surf2);border:2px solid var(--line);border-radius:12px;padding:12px 13px}
.exq{font-size:14px;font-weight:800;margin-bottom:8px}
.exbox ol{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.exbox ol li{margin-bottom:5px}
.warns{list-style:none;padding:0}
.warns li{position:relative;padding-left:20px;margin-bottom:8px;font-size:13.5px;line-height:1.5;color:var(--ink2);font-weight:500}
.warns li:before{content:'';position:absolute;left:2px;top:7px;width:8px;height:8px;border-radius:99px;background:var(--warn)}

/* ---------- type screen ---------- */
.thero{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.thero .bd{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;
  background:var(--acc);color:var(--on);font-size:12px;font-weight:800}
.thero h2{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:10px 0 5px}
.thero .sub{font-size:13px;font-weight:700;color:var(--ink3)}
.thero .track{margin-top:13px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.chip{height:44px;border-radius:12px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink3);font:800 13px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:transform .07s}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.chip.bad{background:var(--nobg);border-color:var(--noline);color:var(--no)}
.chip.mas{background:var(--ok);border-color:transparent;color:var(--ongreen)}

/* ---------- practice ---------- */
.qwrap{padding:6px 0 4px}
.qlabel{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.qtext{font-size:21px;font-weight:800;line-height:1.36;letter-spacing:-.3px;color:var(--ink);white-space:pre-wrap}
.ansbox{margin-top:18px;min-height:66px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px}
.ansbox .v{flex:1;min-width:0;font:800 32px/1 ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  letter-spacing:-1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ansbox .ph{flex:1;font-size:17px;font-weight:700;color:var(--ink3)}
.ansbox .u{flex:0 0 auto;font:800 14px/1 inherit;color:var(--ink2);background:var(--surf2);border-radius:8px;padding:8px 11px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{height:52px;border-radius:12px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink);font:800 22px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .07s}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.del{font-size:19px;color:var(--ink2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  font-size:15.5px;font-weight:700;line-height:1.4;color:var(--ink);background:var(--surf);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 15px;margin-bottom:10px;
  cursor:pointer;transition:transform .07s}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt .l{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--surf2);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--ink3)}
.opt.sel{border-color:var(--blue);background:var(--selbg);color:var(--blue)}
.opt.sel .l{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.good{border-color:var(--okline);background:var(--okbg);color:var(--ok)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:var(--ongreen)}
.opt.bad{border-color:var(--noline);background:var(--nobg);color:var(--no)}
.opt.bad .l{background:var(--no);border-color:var(--no);color:#fff}
.ta{width:100%;min-height:140px;font-family:inherit;font-size:15px;font-weight:500;line-height:1.5;padding:14px;
  border-radius:14px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink);resize:vertical;margin-top:18px}
.ta:focus{outline:none;border-color:var(--blue)}
.sol{margin-top:18px}
.sol .hd{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.sol .hd .ln{flex:1;height:2px;background:var(--line);border-radius:2px}
.sol ol,.sol ul{margin:0;padding-left:20px;font-size:14px;line-height:1.55;color:var(--ink2);font-weight:500}
.sol ol li,.sol ul li{margin-bottom:7px}
.tip{margin-top:12px;background:var(--warnbg);border:2px solid var(--warnline);border-radius:12px;
  padding:11px 12px;font-size:13.5px;line-height:1.5;color:var(--warn);font-weight:600}
.hintbtn{background:none;border:none;font:800 14px/1 inherit;color:var(--blue);padding:18px 0 0;cursor:pointer}
.hintbox{margin-top:16px;background:var(--surf2);border:2px solid var(--line);border-left:6px solid var(--blue);
  border-radius:10px;padding:11px 12px;font-size:13.5px;line-height:1.5;color:var(--ink2);font-weight:500}

/* ---------- footer feedback ---------- */
.fbh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fbh .ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;background:var(--acc);color:var(--on)}
.fbh .tx{flex:1;min-width:0}
.fbh .t{font-size:17px;font-weight:800;color:var(--acc)}
.fbh .a{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbh .a b{color:var(--ink)}

/* ---------- summary ---------- */
.sum{text-align:center;padding-top:6px}
.ringwrap{position:relative;display:inline-flex;margin:6px 0 4px}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.ringtxt span{font-size:11px;font-weight:800;color:var(--ink3);margin-top:4px;letter-spacing:.4px}
.sumline{font-size:14px;font-weight:700;color:var(--ink3);margin-bottom:20px}
.wlist{background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden;margin-top:8px}
.wi{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:2px solid var(--line);cursor:pointer}
.wi:last-child{border-bottom:none}
.wi:active{background:var(--surf2)}
.wi .wig{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--ink3);background:var(--surf2);
  border-radius:6px;padding:3px 6px}
.wi .wt{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="body"></div>
  <div id="foot"></div>
</div>
<script src="bank.js"></script>
<script>
(function(){
"use strict";
var BANK=window.BANK;
if(!BANK){document.getElementById('body').innerHTML='<p style="padding:40px;text-align:center">bank.js не загрузился</p>';return;}

/* ---------- state ---------- */
var LS='cooprep.v1';
var ST={q:{},theory:{},days:[],today:null,theme:'light'};
(function(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);
  ST.q=o.q||{};ST.theory=o.theory||{};ST.days=o.days||[];ST.today=o.today||null;ST.theme=o.theme||'light';}}catch(e){}})();
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
var THEME=ST.theme;
document.documentElement.setAttribute('data-theme',THEME);

/* ---------- index ---------- */
var TYPES=[],TBY={};
BANK.modules.forEach(function(m){m.types.forEach(function(t){t._m=m;TBY[t.id]=t;TYPES.push(t);
  t.qs.forEach(function(q,i){q._t=t;q._i=i;});});});
var TOTALQ=0,ALLQ=[];
TYPES.forEach(function(t){TOTALQ+=t.qs.length;t.qs.forEach(function(q){ALLQ.push(q);});});

/* ---------- colour system (Duolingo tokens per theme) ---------- */
var ACC={
  m:{l:'#58CC02',d:'#93D333',ll:'#58A700',dl:'#79B933'},
  p:{l:'#1CB0F6',d:'#49C0F8',ll:'#1899D6',dl:'#3AA4D8'},
  b:{l:'#FFC800',d:'#FFC700',ll:'#E7A601',dl:'#D79433'},
  l:{l:'#CE82FF',d:'#CE82FF',ll:'#A568CC',dl:'#A568CC'},
  c:{l:'#FF4B4B',d:'#EE5555',ll:'#EA2B2B',dl:'#D84848'},
  j:{l:'#00CD9C',d:'#33D6AE',ll:'#00A87F',dl:'#2BAF8C'},
  f:{l:'#FF9600',d:'#FFAB33',ll:'#E08600',dl:'#D98F22'}
};
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lum(h){var c=hex2rgb(h),f=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]);}
function onFor(h){return lum(h)>0.42?'#131F24':'#FFFFFF';}
function tint(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function macc(m){var a=ACC[m.id]||ACC.m;return THEME==='light'?a.l:a.d;}
function mlip(m){var a=ACC[m.id]||ACC.m;return THEME==='light'?a.ll:a.dl;}
function accentStyle(m){var c=macc(m);return '--acc:'+c+';--accl:'+mlip(m)+';--on:'+onFor(c)+';';}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){if(v===null||v===undefined||isNaN(v))return '—';
  var neg=v<0;v=Math.abs(v);
  var s=Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):String(Math.round(v*1000)/1000);
  var p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
  return (neg?'\u2212':'')+p.join(',');}
function fmtMs(ms){var s=Math.max(0,Math.round(ms/1000));var m=Math.floor(s/60),r=s%60;
  return m+':'+(r<10?'0':'')+r;}
function parseNum(raw){
  if(raw===null||raw===undefined)return null;
  var s=String(raw).trim().toLowerCase();
  if(!s)return null;
  s=s.replace(/\u00a0/g,' ').replace(/\s+/g,'').replace(',','.');
  var mult=1;
  if(/(млрд|bn)$/.test(s)){mult=1e9;s=s.replace(/(млрд|bn)$/,'');}
  else if(/(млн|kk|mm|m)$/.test(s)){mult=1e6;s=s.replace(/(млн|kk|mm|m)$/,'');}
  else if(/(тыс|k)$/.test(s)){mult=1e3;s=s.replace(/(тыс|k)$/,'');}
  s=s.replace(/[\u20bd$\u20ac\u00a3%]/g,'');
  if(!/^[0-9.+\-]+$/.test(s))return null;
  var v=parseFloat(s);
  if(isNaN(v))return null;
  return v*mult;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ring(pct,color,size){
  var sw=Math.round(size/13),r=(size-sw)/2,c=2*Math.PI*r,
      off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/>'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" '
   +'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}

/* ---------- stats ---------- */
function isOk(q){var s=ST.q[q.id];return !!(s&&s.s==='ok');}
function isMas(q){var s=ST.q[q.id];return !!(s&&s.s==='ok'&&s.first);}
function isBad(q){var s=ST.q[q.id];return !!(s&&s.s==='bad');}
function tStat(t){var o=0,m=0,b=0;t.qs.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q))b++;});return{ok:o,m:m,bad:b,total:t.qs.length};}
function gStat(){var o=0,m=0,b=0;ALLQ.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q))b++;});return{ok:o,m:m,bad:b,total:TOTALQ};}
function badList(){return ALLQ.filter(isBad);}
function dayKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayN(){var k=dayKey(new Date());return (ST.today&&ST.today.d===k)?(ST.today.n||0):0;}
function bumpToday(){var k=dayKey(new Date());
  if(!ST.today||ST.today.d!==k)ST.today={d:k,n:0};ST.today.n++;save();}
function record(q,ok,ms){
  var s=ST.q[q.id]||{tries:0};
  s.tries=(s.tries||0)+1;
  if(s.first===undefined||s.first===null)s.first=!!ok;
  s.s=ok?'ok':'bad';s.ms=ms||0;s.ts=Date.now();
  ST.q[q.id]=s;bumpToday();save();
}
function markDay(){var k=dayKey(new Date());if(ST.days.indexOf(k)<0){ST.days.push(k);save();}}
function streak(){var set={};ST.days.forEach(function(d){set[d]=1;});
  var n=0,d=new Date();while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function checkNum(q,raw){
  var v=parseNum(raw);if(v===null)return{invalid:true};
  var cand=[q.a].concat(q.alt||[]);
  var tol=(q.tol!==undefined&&q.tol!==null)?q.tol:Math.max(Math.abs(q.a)*0.005,0.005);
  for(var i=0;i<cand.length;i++){if(Math.abs(v-cand[i])<=tol)return{ok:true,v:v};}
  return{ok:false,v:v};
}

    if(!list.length)return;
    S={list:list,idx:startAt||0,mode:mode,answered:false,ok:null,user:'',pick:null,val:'',hint:false,revealed:false,
       done:0,correct:0,wrong:[],startedAt:Date.now(),taskStart:Date.now(),endedAt:null,
       deadline:(mode==='drill')?Date.now()+20*60*1000:null};
    screen='practice';render();
  },
  retry:function(){var b=badList();if(!b.length)return;
    A.run(shuffle(b.map(function(q){return{tid:q._t.id,qi:q._i};})),'type');},
  redoWrong:function(){if(!S||!S.wrong.length)return;var l=[];
    S.wrong.forEach(function(id){ALLQ.forEach(function(q){if(q.id===id)l.push({tid:q._t.id,qi:q._i});});});
    A.run(l,'type');},
  drill:function(){
    var pool=ALLQ.slice();shuffle(pool);
    function pri(q){var s=ST.q[q.id];if(!s)return 1;return s.s==='bad'?0:2;}
    pool.sort(function(a,b){return pri(a)-pri(b);});
    var pick=[],cnt={};
    for(var lim=1;lim<=4&&pick.length<DAILY;lim++){
      for(var i=0;i<pool.length&&pick.length<DAILY;i++){
        var q=pool[i];if(pick.indexOf(q)>=0)continue;
        var tid=q._t.id;if((cnt[tid]||0)>=lim)continue;
        pick.push(q);cnt[tid]=(cnt[tid]||0)+1;
      }
    }
    if(!pick.length)return;
    A.run(pick.map(function(q){return{tid:q._t.id,qi:q._i};}),'drill');
  },
  leave:function(){S=null;screen=typeId?'type':'home';render();},
  hint:function(){if(!S)return;var el=document.getElementById('ans');
    if(el&&el.value!==undefined)S.val=el.value;S.hint=true;render();},
  key:function(k){
    if(!S||S.answered)return;
    var v=S.val||'';
    if(k==='del')v=v.slice(0,-1);
    else if(k===','){if(v.indexOf(',')<0&&v.indexOf('.')<0)v=v+',';}
    else if(v.length<14)v=v+k;
    S.val=v;render();
  },
  pick:function(i){if(!S||S.answered)return;S.pick=(S.pick===i?null:i);render();},
  check:function(){
    var c=cur();if(!c||S.answered)return;
    if(c.q.kind==='num'){
      if(!S.val)return;
      var r=checkNum(c.q,S.val);
      if(r.invalid)return;
      A.finish(!!r.ok,S.val);
    } else if(c.q.kind==='mc'){
      if(S.pick===null||S.pick===undefined)return;
      A.finish(S.pick===c.q.correct,String.fromCharCode(65+S.pick)+'. '+c.q.opts[S.pick]);
    }
  },
  reveal:function(){var el=document.getElementById('ans');if(el&&S)S.val=el.value;if(S)S.revealed=true;render();},
  selfGood:function(){A.finish(true,S.val);},
  selfBad:function(){A.finish(false,S.val);},
  finish:function(ok,user){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=ok;S.user=user||'';
    record(c.q,ok,Date.now()-S.taskStart);
    S.done++;if(ok)S.correct++;else S.wrong.push(c.q.id);
    render();
  },
  next:function(){
    if(!S)return;
    if(S.idx+1>=S.list.length){S.endedAt=Date.now();screen='summary';markDay();render();return;}
    S.idx++;S.answered=false;S.ok=null;S.user='';S.pick=null;S.val='';S.hint=false;S.revealed=false;S.taskStart=Date.now();
    render();
  }
};

document.addEventListener('keydown',function(e){
  if(screen!=='practice'||!S)return;
  var c=cur();if(!c)return;
  if(!S.answered&&c.q.kind==='num'&&/^[0-9]$/.test(e.key)){e.preventDefault();A.key(e.key);return;}
  if(!S.answered&&c.q.kind==='num'&&(e.key===','||e.key==='.')){e.preventDefault();A.key(',');return;}
  if(!S.answered&&c.q.kind==='num'&&e.key==='Backspace'){e.preventDefault();A.key('del');return;}
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(!S.answered)A.check(); else A.next();
});

setInterval(function(){
  if(screen!=='practice'||!S)return;
  var el=document.getElementById('timer');if(!el)return;
  var c=cur();if(!c)return;
  if(S.deadline){
    var left=S.deadline-Date.now();
    el.textContent=fmtMs(left);
    el.className='ptime'+(left<60000?' crit':left<300000?' over':'');
    if(left<=0){S.endedAt=Date.now();screen='summary';markDay();render();}
  } else {
    var t=Date.now()-S.taskStart;
    el.textContent=fmtMs(t);
    var target=(c.t.targetSec||90)*1000;
    el.className='ptime'+(t>target*2?' crit':t>target?' over':'');
  }
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});
}
render();
})();
</script>
