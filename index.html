<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COO Prep</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="COO Prep">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- tokens: Duolingo light / dark ---------- */
:root{
  --bg:#FFFFFF; --surf:#FFFFFF; --surf2:#F7F7F7; --line:#E5E5E5;
  --ink:#4B4B4B; --ink2:#777777; --ink3:#969BA0;
  --green:#58CC02; --greenl:#58A700; --ongreen:#FFFFFF;
  --blue:#1CB0F6; --bluel:#1899D6; --selbg:#DDF4FF;
  --ok:#58A700; --okbg:#D7FFB8; --okline:#A5ED6E;
  --no:#EA2B2B; --nobg:#FFDFE0; --noline:#FFB2B2;
  --warn:#CD7900; --warnbg:#FFF5D3; --warnline:#FFC800;
}
html[data-theme="dark"]{
  --bg:#131F24; --surf:#202F36; --surf2:#26343B; --line:#37464F;
  --ink:#F1F7FB; --ink2:#AFBEC7; --ink3:#8296A0;
  --green:#93D333; --greenl:#79B933; --ongreen:#131F24;
  --blue:#49C0F8; --bluel:#3AA4D8; --selbg:#1E333D;
  --ok:#93D333; --okbg:#1C3226; --okline:#79B933;
  --no:#EE5555; --nobg:#332124; --noline:#D84848;
  --warn:#FFC800; --warnbg:#2E2712; --warnline:#D79433;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#top{flex:0 0 auto;display:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
#top.on{display:block}
#body{flex:1 1 auto;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#foot{flex:0 0 auto;display:none;background:var(--bg);border-top:2px solid var(--line)}
#foot.on{display:block}
.wrap{width:100%;max-width:620px;margin:0 auto;padding:0 16px}
.wrap.mid{margin:auto}
.fin{width:100%;max-width:620px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.anim{animation:up .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.xbtn{flex:0 0 auto;width:32px;height:32px;border:none;background:none;color:var(--ink3);
  font:800 22px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}
.prow{display:flex;align-items:center;gap:12px}
.track{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{position:relative;display:block;height:100%;border-radius:99px;background:var(--acc,var(--green));
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.track>i:after{content:'';position:absolute;left:6px;right:6px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
.track.sm{height:12px}
.pcount{flex:0 0 auto;font:800 14px/1 inherit;color:var(--ink2);font-variant-numeric:tabular-nums}
.ptime{flex:0 0 auto;min-width:44px;text-align:right;font:800 13px/1 inherit;color:var(--ink3);font-variant-numeric:tabular-nums}
.ptime.over{color:var(--warn)} .ptime.crit{color:var(--no)}
.hrow{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.hrow .ht{flex:1;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- buttons (Duolingo: radius 12, lip 4px, uppercase, .8px) ---------- */
.btn{position:relative;display:block;width:100%;min-height:50px;padding:14px 16px;border:none;border-radius:12px;
  cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:var(--acc,var(--green));color:var(--on,var(--ongreen));
  box-shadow:0 4px 0 var(--accl,var(--greenl));transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accl,var(--greenl))}
.btn[disabled]{background:var(--line);color:var(--ink3);box-shadow:0 4px 0 var(--line);cursor:default}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--line)}
.btn.sec{background:var(--surf);color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  text-transform:none;letter-spacing:0;font-size:14.5px}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn.link{background:none;box-shadow:none;border:none;color:var(--blue);text-transform:none;letter-spacing:0;
  font-size:14px;font-weight:700;min-height:46px}
.btn.link:active{transform:none;opacity:.6}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1;min-width:0}

/* ---------- cards ---------- */
.card{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:15px 16px}
.card.lip{box-shadow:0 4px 0 var(--line)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}

/* ---------- home ---------- */
.brandrow{display:flex;align-items:center;gap:12px;padding:14px 0 18px}
.brand{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.brand-s{font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:2px}
.streak{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:5px;
  background:var(--surf2);border:2px solid var(--line);border-radius:99px;padding:6px 12px}
.streak b{font-size:15px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
.streak span{font-size:11px;font-weight:700;color:var(--ink3)}
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.hero-n{font-size:12px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.hero-txt{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:11px}
.stats{display:flex;margin-top:16px;background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stats>div{flex:1;padding:14px 6px;text-align:center;border-right:2px solid var(--line)}
.stats>div:last-child{border-right:none}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats b.r{color:var(--no)}
.stats span{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:5px}
.mod{margin-top:24px}
.mod-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.mod-dot{width:12px;height:12px;border-radius:4px;background:var(--acc);flex:0 0 auto}
.mod-t{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
.mod-c{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
  padding:12px 13px 13px;transition:transform .07s}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile .num{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;
  background:var(--acc);color:var(--on);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .st{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;color:var(--no)}
.tile .st.ok{color:var(--ok)}
.tile .nm{display:block;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink);margin:8px 0 6px;min-height:35px}
.tile .cnt{display:block;font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.footrow{display:flex;gap:10px;margin-top:26px}
.foot{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);padding:16px 0 4px}

/* ---------- accordion ---------- */
.acc{margin-top:20px;background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:var(--surf);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;font-size:14px;font-weight:800}
.acc>.ah:active{background:var(--surf2)}
.acc>.ah:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.acc>.ah .chev{margin-left:auto;color:var(--ink3);font-size:16px;transition:transform .2s}
.acc.open>.ah .chev{transform:rotate(90deg)}
.acc>.ab{display:none;padding:4px 16px 16px;border-top:2px solid var(--line)}
.acc.open>.ab{display:block}
.sh{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}
.sh:first-child{margin-top:14px}
.sp{font-size:14px;line-height:1.6;color:var(--ink2);font-weight:500}
.steps{list-style:none;counter-reset:s;padding:0}
.steps li{position:relative;padding-left:32px;margin-bottom:10px;font-size:14px;line-height:1.55;
  counter-increment:s;color:var(--ink2);font-weight:500}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:7px;
  background:var(--acc);color:var(--on);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fml{font:700 13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surf2);
  border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;color:var(--blue);
  overflow-x:auto;white-space:nowrap}
.exbox{background:var(--surf2);border:2px solid var(--line);border-radius:12px;padding:12px 13px}
.exq{font-size:14px;font-weight:800;margin-bottom:8px}
.exbox ol{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.exbox ol li{margin-bottom:5px}
.warns{list-style:none;padding:0}
.warns li{position:relative;padding-left:20px;margin-bottom:8px;font-size:13.5px;line-height:1.5;color:var(--ink2);font-weight:500}
.warns li:before{content:'';position:absolute;left:2px;top:7px;width:8px;height:8px;border-radius:99px;background:var(--warn)}

/* ---------- beginner-first knowledge layer ---------- */
.learn{margin:16px 0 22px;padding:2px 0 0}
.learn-kicker{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.learn h3{font-size:21px;line-height:1.25;font-weight:800;letter-spacing:-.25px;color:var(--ink);margin-bottom:9px}
.learn-plain{font-size:16px;line-height:1.6;color:var(--ink);font-weight:500;margin-bottom:14px}
.learn-label{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:17px 0 7px}
.learn-cue{font-size:14px;line-height:1.55;color:var(--ink2);font-weight:600;background:var(--selbg);border-left:5px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0}
.learn-list{list-style:none;padding:0;counter-reset:learnstep}
.learn-list li{position:relative;padding:0 0 10px 31px;font-size:14.5px;line-height:1.55;color:var(--ink2);font-weight:500;counter-increment:learnstep}
.learn-list li:before{content:counter(learnstep);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:7px;background:var(--acc);color:var(--on);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.learn-example{background:var(--surf2);border:2px solid var(--line);border-radius:12px;padding:12px 13px}
.learn-example .exq{font-size:15px;line-height:1.45;margin-bottom:8px}
.learn-example ol{margin:0;padding-left:20px;font-size:14px;line-height:1.55;color:var(--ink2)}
.learn-example ol li{margin-bottom:6px}
.learn-voice{font-size:15px;line-height:1.55;color:var(--ink);font-weight:700;padding:11px 13px;background:var(--warnbg);border-left:5px solid var(--warn);border-radius:0 10px 10px 0}
.learn-check{list-style:none;padding:0}
.learn-check li{font-size:14px;line-height:1.5;color:var(--ink2);padding:4px 0 4px 25px;position:relative}
.learn-check li:before{content:'□';position:absolute;left:0;top:1px;font-size:19px;line-height:1;color:var(--acc);font-weight:800}
.formula-note{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-bottom:8px}
.fml{font:600 16px/1.45 "Cambria Math","STIX Two Math","DejaVu Serif",Georgia,serif;text-align:center;letter-spacing:0;background:var(--surf2);
  border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:7px;color:var(--blue);overflow-x:auto;white-space:nowrap}
.fml sup,.fml sub{font-size:.72em;line-height:0}

/* ---------- in-question guidance and mistake explanations ---------- */
.mistake{margin-top:14px;background:var(--nobg);border:2px solid var(--noline);border-radius:12px;padding:12px 13px;color:var(--no)}
.mistake .mt{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.mistake p{font-size:13.5px;line-height:1.5;font-weight:600;margin-top:5px}
.mistake b{font-weight:800}

/* ---------- type screen ---------- */
.thero{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.thero .bd{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;
  background:var(--acc);color:var(--on);font-size:12px;font-weight:800}
.thero h2{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:10px 0 5px}
.thero .sub{font-size:13px;font-weight:700;color:var(--ink3)}
.thero .track{margin-top:13px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.chip{height:44px;border-radius:12px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink3);font:800 13px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:transform .07s}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.chip.bad{background:var(--nobg);border-color:var(--noline);color:var(--no)}
.chip.mas{background:var(--ok);border-color:transparent;color:var(--ongreen)}

/* ---------- practice ---------- */
.qwrap{padding:6px 0 4px}
.qlabel{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.qtext{font-size:21px;font-weight:800;line-height:1.36;letter-spacing:-.3px;color:var(--ink);white-space:pre-wrap}
.tw{overflow-x:auto;margin:0 0 18px;border:2px solid var(--line);border-radius:12px;background:var(--surf)}
table.qt{width:100%;border-collapse:collapse;font-size:13px}
table.qt th{background:var(--surf2);color:var(--ink2);font-weight:800;font-size:10px;letter-spacing:.2px;
  text-transform:uppercase;text-align:left;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.qt td{padding:8px 8px;border-bottom:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;
  white-space:nowrap;font-size:12.5px}
table.qt tr:last-child td{border-bottom:none}
.ansbox{margin-top:18px;min-height:66px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px}
.ansbox .v{flex:1;min-width:0;font:800 32px/1 ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  letter-spacing:-1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ansbox .ph{flex:1;font-size:17px;font-weight:700;color:var(--ink3)}
.ansbox .u{flex:0 0 auto;font:800 14px/1 inherit;color:var(--ink2);background:var(--surf2);border-radius:8px;padding:8px 11px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{height:52px;border-radius:12px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink);font:800 22px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .07s}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.del{font-size:19px;color:var(--ink2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  font-size:15.5px;font-weight:700;line-height:1.4;color:var(--ink);background:var(--surf);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 15px;margin-bottom:10px;
  cursor:pointer;transition:transform .07s}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt .l{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--surf2);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--ink3)}
.opt.sel{border-color:var(--blue);background:var(--selbg);color:var(--blue)}
.opt.sel .l{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.good{border-color:var(--okline);background:var(--okbg);color:var(--ok)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:var(--ongreen)}
.opt.bad{border-color:var(--noline);background:var(--nobg);color:var(--no)}
.opt.bad .l{background:var(--no);border-color:var(--no);color:#fff}
.ta{width:100%;min-height:140px;font-family:inherit;font-size:15px;font-weight:500;line-height:1.5;padding:14px;
  border-radius:14px;background:var(--surf);border:2px solid var(--line);border-bottom-width:4px;
  color:var(--ink);resize:vertical;margin-top:18px}
.ta:focus{outline:none;border-color:var(--blue)}
.sol{margin-top:18px}
.sol .hd{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.sol .hd .ln{flex:1;height:2px;background:var(--line);border-radius:2px}
.sol ol,.sol ul{margin:0;padding-left:20px;font-size:14px;line-height:1.55;color:var(--ink2);font-weight:500}
.sol ol li,.sol ul li{margin-bottom:7px}
.tip{margin-top:12px;background:var(--warnbg);border:2px solid var(--warnline);border-radius:12px;
  padding:11px 12px;font-size:13.5px;line-height:1.5;color:var(--warn);font-weight:600}
.hintbtn{background:none;border:none;font:800 14px/1 inherit;color:var(--blue);padding:18px 0 0;cursor:pointer}
.linkrow{display:flex;gap:8px;margin-top:16px}
.linkrow>.btn{flex:1;min-width:0}
.hintbox{margin-top:16px;background:var(--surf2);border:2px solid var(--line);border-left:6px solid var(--blue);
  border-radius:10px;padding:11px 12px;font-size:13.5px;line-height:1.5;color:var(--ink2);font-weight:500}

/* ---------- footer feedback ---------- */
.fbh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fbh .ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;background:var(--acc);color:var(--on)}
.fbh .tx{flex:1;min-width:0}
.fbh .t{font-size:17px;font-weight:800;color:var(--acc)}
.fbh .a{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbh .a b{color:var(--ink)}

/* ---------- summary ---------- */
.sum{text-align:center;padding-top:6px}
.ringwrap{position:relative;display:inline-flex;margin:6px 0 4px}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.ringtxt span{font-size:11px;font-weight:800;color:var(--ink3);margin-top:4px;letter-spacing:.4px}
.sumline{font-size:14px;font-weight:700;color:var(--ink3);margin-bottom:20px}
.wlist{background:var(--surf);border:2px solid var(--line);border-radius:16px;overflow:hidden;margin-top:8px}
.wi{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:2px solid var(--line);cursor:pointer}
.wi:last-child{border-bottom:none}
.wi:active{background:var(--surf2)}

</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="body"></div>
  <div id="foot"></div>
</div>
<script src="bank.js?v=1.2"></script>
<script src="expansion.js?v=1.2"></script>
<script src="knowledge.js?v=1.2"></script>
<script>
(function(){
"use strict";
var BANK=window.BANK;
if(!BANK){document.getElementById('body').innerHTML='<p style="padding:40px;text-align:center">bank.js не загрузился</p>';return;}
var KNOWLEDGE=window.KNOWLEDGE||{};

/* ---------- state ---------- */
var LS='cooprep.v1';
var ST={q:{},theory:{},days:[],today:null,theme:'light'};
(function(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);
  ST.q=o.q||{};ST.theory=o.theory||{};ST.days=o.days||[];ST.today=o.today||null;ST.theme=o.theme||'light';}}catch(e){}})();
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
var THEME=ST.theme;
document.documentElement.setAttribute('data-theme',THEME);

/* ---------- index ---------- */
var TYPES=[],TBY={};
BANK.modules.forEach(function(m){m.types.forEach(function(t){t._m=m;TBY[t.id]=t;TYPES.push(t);
  t.qs.forEach(function(q,i){q._t=t;q._i=i;});});});
var TOTALQ=0,ALLQ=[];
TYPES.forEach(function(t){TOTALQ+=t.qs.length;t.qs.forEach(function(q){ALLQ.push(q);});});

/* ---------- colour system (Duolingo tokens per theme) ---------- */
var ACC={
  m:{l:'#58CC02',d:'#93D333',ll:'#58A700',dl:'#79B933'},
  p:{l:'#1CB0F6',d:'#49C0F8',ll:'#1899D6',dl:'#3AA4D8'},
  b:{l:'#FFC800',d:'#FFC700',ll:'#E7A601',dl:'#D79433'},
  l:{l:'#CE82FF',d:'#CE82FF',ll:'#A568CC',dl:'#A568CC'},
  c:{l:'#FF4B4B',d:'#EE5555',ll:'#EA2B2B',dl:'#D84848'},
  j:{l:'#00CD9C',d:'#33D6AE',ll:'#00A87F',dl:'#2BAF8C'},
  f:{l:'#FF9600',d:'#FFAB33',ll:'#E08600',dl:'#D98F22'},
  pm:{l:'#0E7490',d:'#22A2BF',ll:'#0B5A70',dl:'#1C8AA6'}
};
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lum(h){var c=hex2rgb(h),f=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]);}
function onFor(h){return lum(h)>0.42?'#131F24':'#FFFFFF';}
function tint(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function macc(m){var a=ACC[m.id]||ACC.m;return THEME==='light'?a.l:a.d;}
function mlip(m){var a=ACC[m.id]||ACC.m;return THEME==='light'?a.ll:a.dl;}
function accentStyle(m){var c=macc(m);return '--acc:'+c+';--accl:'+mlip(m)+';--on:'+onFor(c)+';';}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){if(v===null||v===undefined||isNaN(v))return '—';
  var neg=v<0;v=Math.abs(v);
  var s=Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):String(Math.round(v*1000)/1000);
  var p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
  return (neg?'\u2212':'')+p.join(',');}
function fmtMs(ms){var s=Math.max(0,Math.round(ms/1000));var m=Math.floor(s/60),r=s%60;
  return m+':'+(r<10?'0':'')+r;}
/* Разбор введённого числа возвращает ВСЕ правдоподобные прочтения, а не одно:
   «120,000» это и 120000, и 120; «1,200» это и 1200, и 1,2; «12,5» только 12,5.
   Дальше сравниваем с ожидаемым ответом — так верная запись не ломается. */
function readings(raw){
  var res=[];
  if(raw===null||raw===undefined)return res;
  var s=String(raw).trim().toLowerCase();
  if(!s)return res;
  s=s.replace(/\u00a0/g,' ').replace(/\s+/g,'').replace(/[\u20bd$\u20ac\u00a3%]/g,'');
  var mult=1;
  if(/(млрд|bn)$/.test(s)){mult=1e9;s=s.replace(/(млрд|bn)$/,'');}
  else if(/(млн|kk|mm|m)$/.test(s)){mult=1e6;s=s.replace(/(млн|kk|mm|m)$/,'');}
  else if(/(тыс|k)$/.test(s)){mult=1e3;s=s.replace(/(тыс|k)$/,'');}
  if(!/^[+\-]?[0-9.,]+$/.test(s))return res;
  var sign=(s.charAt(0)==='-')?-1:1;
  s=s.replace(/^[+\-]/,'');
  var push=function(t){var v=parseFloat(t);if(!isNaN(v)&&res.indexOf(v)<0)res.push(v);};
  if(/^\d{1,3}([,.]\d{3})+$/.test(s))push(s.replace(/[,.]/g,''));   /* 120,000 / 1.200.000 — тысячи */
  if(/^\d+$/.test(s))push(s);                                       /* целое */
  var m;
  if((m=s.match(/^(\d+)[.,](\d+)$/)))push(m[1]+'.'+m[2]);           /* 12,5 -> 12.5 ; 1,200 -> 1.2 */
  if((m=s.match(/^(\d{1,3}(?:[.,]\d{3})+)[.,](\d+)$/)))push(m[1].replace(/[.,]/g,'')+'.'+m[2]);
  for(var i=0;i<res.length;i++)res[i]=res[i]*mult*sign;
  return res;
}
/* сколько знаков после запятой набрал человек — от этого зависит допуск на округление */
function decimalsTyped(raw){
  var t=String(raw||'').replace(/[\s\u00a0]/g,'').replace(/[^0-9.,]/g,'');
  var k=Math.max(t.lastIndexOf(','),t.lastIndexOf('.'));
  if(k<0)return 0;
  var fr=t.slice(k+1);
  return /^[0-9]+$/.test(fr)?Math.min(fr.length,3):0;
}
/* что считаем верным ответом: сама величина плюс равнозначные записи (процент <-> доля) */
function candidates(q){
  var c=[q.a].concat(q.alt||[]);
  /* долю принимаем вместо процента только там, где вопрос не задаёт шкалу:
     если в условии прямо сказано «в процентах», ответ долей остаётся ошибкой — это и есть навык */
  if(!q.unit&&q.a!==0&&Math.abs(q.a)<1)c.push(q.a*100);
  return c;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tableHtml(t){
  var h='<table class="qt"><thead><tr>',i,j;
  for(i=0;i<t.head.length;i++)h+='<th>'+esc(t.head[i])+'</th>';
  h+='</tr></thead><tbody>';
  for(i=0;i<t.rows.length;i++){
    h+='<tr>';
    for(j=0;j<t.rows[i].length;j++)h+='<td>'+esc(t.rows[i][j])+'</td>';
    h+='</tr>';
  }
  return h+'</tbody></table>';
}
function formulaHtml(s){
  /* Keep formulas offline, readable and typographically closer to maths than
     a phone-style text string. The source remains plain text for accessibility. */
  return esc(s).replace(/\^\(([^)]+)\)/g,'<sup>($1)</sup>').replace(/\^(\d+|[A-Za-z]+)/g,'<sup>$1</sup>');
}
function ring(pct,color,size){
  var sw=Math.round(size/13),r=(size-sw)/2,c=2*Math.PI*r,
      off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/>'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" '
   +'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}

/* ---------- stats ---------- */
function isOk(q){var s=ST.q[q.id];return !!(s&&s.s==='ok');}
function isMas(q){var s=ST.q[q.id];return !!(s&&s.s==='ok'&&s.first);}
function isBad(q){var s=ST.q[q.id];return !!(s&&s.s==='bad');}
function tStat(t){var o=0,m=0,b=0;t.qs.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q))b++;});return{ok:o,m:m,bad:b,total:t.qs.length};}
/* вес типа для тренировки: слабые темы получают больше слотов */
function typeWeight(t){
  var s=tStat(t),seen=s.ok+s.bad;
  var err=seen?(s.bad/seen):0.5;
  var mastery=s.total?(s.ok/s.total):0;
  return 0.35+(1-mastery)+err*0.8;
}
function gStat(){var o=0,m=0,b=0;ALLQ.forEach(function(q){
  if(isOk(q)){o++;if(isMas(q))m++;}else if(isBad(q))b++;});return{ok:o,m:m,bad:b,total:TOTALQ};}
function badList(){return ALLQ.filter(isBad);}
function dayKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayN(){var k=dayKey(new Date());return (ST.today&&ST.today.d===k)?(ST.today.n||0):0;}
function bumpToday(){var k=dayKey(new Date());
  if(!ST.today||ST.today.d!==k)ST.today={d:k,n:0};ST.today.n++;save();}
function record(q,ok,ms,skipped,noHint){
  var s=ST.q[q.id]||{tries:0};
  s.tries=(s.tries||0)+1;
  if(s.first===undefined||s.first===null)s.first=!!ok;
  s.s=ok?'ok':'bad';s.ms=ms||0;s.ts=Date.now();
  if(skipped)s.sk=(s.sk||0)+1;
  var clean=!!ok&&!skipped&&!!noHint;
  if(clean)s.lv=Math.min((s.lv||0)+1,INT.length);else s.lv=0;
  s.due=dayNum()+(clean?INT[s.lv-1]:1);
  ST.q[q.id]=s;bumpToday();save();
}
function markDay(){var k=dayKey(new Date());if(ST.days.indexOf(k)<0){ST.days.push(k);save();}}
function streak(){var set={};ST.days.forEach(function(d){set[d]=1;});
  var n=0,d=new Date();while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function checkNum(q,raw){
  var rs=readings(raw);
  if(!rs.length)return{invalid:true};
  var cand=candidates(q);
  var baseTol=(q.tol!==undefined&&q.tol!==null)?q.tol:Math.max(Math.abs(q.a)*0.015,0.01);
  /* если человек округлил корректно, принимаем округление: «31» для 31,25 проходит,
     а «1» для 0,8 — нет, потому что шаг округления слишком грубый относительно величины */
  var step=0.5*Math.pow(10,-decimalsTyped(raw));
  for(var i=0;i<cand.length;i++){
    var c=cand[i];
    var tol=Math.max(baseTol,baseTol/Math.max(Math.abs(q.a),1e-9)*Math.abs(c));
    var roundTol=(step<=Math.max(tol,0.05*Math.abs(c)))?step:0;
    for(var j=0;j<rs.length;j++){if(Math.abs(rs[j]-c)<=tol+roundTol)return{ok:true,v:rs[j]};}
  }
  return{ok:false,v:rs[0]};
}

/* ---------- nav ---------- */
var screen='home',typeId=null,S=null,accTheory=false,accProto=false,lastNav=null,DAILY=12;
/* Интервальное повторение. Отвечено верно без подсказки — интервал растёт;
   ошибка, пропуск или ответ с подсказкой — интервал сбрасывается на сутки. */
var INT=[1,2,4,7];
function dayNum(){var n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*60000)/86400000);}
function isDue(q){var s=ST.q[q.id];if(!s)return false;
  if(s.s!=='ok')return true;                       /* ошибка или пропуск — к повтору сразу */
  return s.due!==undefined&&s.due<=dayNum();}       /* верный ответ возвращается по расписанию */
function dueList(){return ALLQ.filter(isDue).sort(function(a,b){
  return (ST.q[a.id].due||0)-(ST.q[b.id].due||0);});}
function cur(){if(!S)return null;var it=S.list[S.idx];if(!it)return null;var t=TBY[it.tid];
  if(!t)return null;return{t:t,q:t.qs[it.qi]};}

function render(){
  var top=document.getElementById('top'),body=document.getElementById('body'),foot=document.getElementById('foot');
  var nav=screen+'|'+(S?S.idx:'')+'|'+(typeId||'');
  var th='',bh='',fh='';
  if(screen==='home'){bh=viewHome();}
  else if(screen==='type'){th=headType();bh=viewType();}
  else if(screen==='practice'){th=headPrac();bh=viewPrac();fh=footPrac();}
  else if(screen==='summary'){th=headSum();bh=viewSum();}
  top.className=th?'on':'';top.innerHTML=th;
  body.innerHTML=bh;
  foot.className=fh?'on':'';foot.innerHTML=fh;
  if(nav!==lastNav){
    body.scrollTop=0;
    var w=body.querySelector('.wrap,.sum,.qwrap');
    var host=body.firstElementChild;
    if(host)host.classList.add('anim');
    lastNav=nav;
  }
}

/* ---------- home ---------- */
function viewHome(){
  var g=gStat(),bads=badList(),st=streak(),tn=todayN();
  var pct=Math.min(100,tn/DAILY*100);
  var h='<div class="wrap">';
  h+='<div class="brandrow"><div><div class="brand">COO Prep</div>'
   +'<div class="brand-s">Spectral · Project Manager, Back Office</div></div>';
  if(st>0)h+='<div class="streak"><b>'+st+'</b><span>'+(st===1?'день':'дней')+'</span></div>';
  h+='</div>';
  h+='<div class="card lip"><div class="hero-top"><span class="lbl">Дневная тренировка</span>'
   +'<span class="hero-n">'+DAILY+' задач · 20 мин</span></div>'
   +'<div class="track"><i style="width:'+pct+'%"></i></div>'
   +'<div class="hero-txt">'+(tn>=DAILY?('Закрыто: '+tn+' за сегодня. Бери любой модуль ниже.')
     :(tn?('Сегодня '+tn+' из '+DAILY+' · осталось '+(DAILY-tn)):'Микс из всех типов, слабые места первыми'))+'</div></div>';
  h+='<div style="margin-top:12px"><button class="btn" onclick="A.drill()">'
   +(tn>=DAILY?'Ещё тренировка':'Начать тренировку')+'</button></div>';
  var dueN=dueList().length;
  if(dueN)h+='<div style="margin-top:10px"><button class="btn sec" onclick="A.review()">'
   +'Повторить по расписанию · '+dueN+'</button></div>';
  h+='<div class="stats"><div><b>'+g.ok+'</b><span>решено</span></div>'
   +'<div><b class="'+(dueN?'r':'')+'">'+dueN+'</b><span>к повтору</span></div>'
   +'<div><b>'+g.m+'</b><span>с 1-й попытки</span></div></div>';
  BANK.modules.forEach(function(m){
    var tot=0,mst=0;m.types.forEach(function(t){var s=tStat(t);tot+=s.total;mst+=s.ok;});
    h+='<div class="mod" style="'+accentStyle(m)+'">';
    h+='<div class="mod-h"><span class="mod-dot"></span><span class="mod-t">'+esc(m.title)+'</span>'
     +'<span class="mod-c">'+mst+'/'+tot+'</span></div><div class="tiles">';
    m.types.forEach(function(t){
      var s=tStat(t);
      h+='<button class="tile" onclick="A.open(\''+t.id+'\')"><span class="num">'+esc(t.num)+'</span>';
      if(s.bad>0)h+='<span class="st">'+s.bad+'</span>';
      else if(s.ok===s.total&&s.total)h+='<span class="st ok">✓</span>';
      h+='<span class="nm">'+esc(t.title)+'</span><span class="cnt">'+s.ok+' из '+s.total+'</span></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="acc'+(accProto?' open':'')+'"><button class="ah" aria-expanded="'+(accProto?'true':'false')+'" aria-controls="protocol-body" onclick="A.proto()">'
   +'<span>Протокол ответа на незнакомую задачу</span><span class="chev">›</span></button><div class="ab" id="protocol-body">'
   +'<ol class="steps">'+BANK.protocol.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>'
   +(BANK.protocol.note?'<p class="sp" style="margin-top:10px">'+esc(BANK.protocol.note)+'</p>':'')+'</div></div>';
  h+='<div class="footrow"><button class="btn sec" onclick="A.theme()">'
   +(THEME==='light'?'Тёмная тема':'Светлая тема')+'</button>'
   +'<button class="btn sec" onclick="A.reset()">Сбросить</button></div>';
  h+='<div class="foot">v'+esc(BANK.meta.version)+' · '+TYPES.length+' тем · '+TOTALQ+' задач</div>';
  return h+'</div>';
}

/* ---------- type ---------- */
function headType(){var t=TBY[typeId];
  return '<div class="hrow"><button class="xbtn" aria-label="Назад к списку тем" title="Назад" onclick="A.home()">‹</button>'
   +'<div class="ht">'+esc(t.num+' · '+t.title)+'</div></div>';}
function learnCard(t){
  var k=KNOWLEDGE[t.id];
  if(!k)return '';
  var h='<section class="learn" aria-label="Объяснение темы">';
  h+='<div class="learn-kicker">С нуля, на пальцах</div><h3>'+esc(t.title)+'</h3>';
  h+='<p class="learn-plain">'+esc(k.plain)+'</p>';
  if(k.cue)h+='<div class="learn-label">Как понять, что это такая задача</div><div class="learn-cue">'+esc(k.cue)+'</div>';
  if(k.steps&&k.steps.length)h+='<div class="learn-label">Что делать по шагам</div><ol class="learn-list">'
    +k.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(k.example)h+='<div class="learn-label">Мини-пример с разбором</div><div class="learn-example"><div class="exq">'+esc(k.example.q)+'</div><ol>'
    +k.example.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(k.say)h+='<div class="learn-label">Фраза, которую можно сказать на интервью</div><div class="learn-voice">'+esc(k.say)+'</div>';
  if(k.check&&k.check.length)h+='<div class="learn-label">Быстрая самопроверка</div><ul class="learn-check">'
    +k.check.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  h+='</section>';
  return h;
}
function viewType(){
  var t=TBY[typeId],s=tStat(t),m=t._m;
  var pct=s.total?Math.round(s.m/s.total*100):0;
  var h='<div class="wrap" style="'+accentStyle(m)+'">';
  h+='<div class="thero"><span class="bd">'+esc(t.num)+'</span>'
   +'<h2>'+esc(t.title)+'</h2>'
   +'<div class="sub">Решено '+s.ok+' из '+s.total+' · с первой попытки '+s.m+(s.bad?' · на повтор '+s.bad:'')+'</div>'
   +'<div class="track"><i style="width:'+pct+'%"></i></div></div>';
  h+=learnCard(t);
  h+='<button class="btn" onclick="A.start(\''+t.id+'\')">Тренировать · '+t.qs.length+'</button>';
  h+='<div style="margin-top:10px">'+(s.bad>0
     ?'<button class="btn sec" onclick="A.startBad(\''+t.id+'\')">Только ошибки · '+s.bad+'</button>'
     :'<button class="btn sec" onclick="A.startShuffle(\''+t.id+'\')">Вперемешку</button>')+'</div>';
  h+='<div class="acc'+(accTheory?' open':'')+'"><button class="ah" aria-expanded="'+(accTheory?'true':'false')+'" aria-controls="type-reference" onclick="A.theory()">'
   +'<span>Шпаргалка и формулы</span><span class="chev">›</span></button><div class="ab" id="type-reference">';
  h+='<div class="sh">Что проверяют</div><p class="sp">'+esc(t.why)+'</p>';
  h+='<div class="sh">Как решать</div><ol class="steps">'
   +t.method.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(t.formulas&&t.formulas.length)h+='<div class="sh">Формулы</div><p class="formula-note">Формула — короткая запись уже объяснённой мысли. Буквы заменяются числами из условия; × означает «умножить», / — «разделить», Σ — «сложить все части». Сначала пойми пример, потом запоминай формулу.</p>'
   +t.formulas.map(function(x){return '<div class="fml" aria-label="Формула">'+formulaHtml(x)+'</div>';}).join('');
  if(t.example)h+='<div class="sh">Разобранный пример</div><div class="exbox"><div class="exq">'
   +esc(t.example.q)+'</div><ol>'+t.example.sol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  if(t.traps&&t.traps.length)h+='<div class="sh">Частые ошибки</div><ul class="warns">'
   +t.traps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  h+='<div class="sh">Норматив</div><p class="sp">'+esc(t.perf||'')+'</p></div></div>';
  h+='<div class="sh">Задачи</div><div class="chips">';
  t.qs.forEach(function(q,i){
    var c=isMas(q)?'mas':isBad(q)?'bad':isOk(q)?'ok':'';
    h+='<button class="chip '+c+'" onclick="A.jump(\''+t.id+'\','+i+')">'+(i+1)+'</button>';
  });
  h+='</div>';
  return h+'</div>';
}

/* ---------- practice ---------- */
function headPrac(){
  var c=cur();if(!c)return '';
  var prog=Math.round((S.idx+1)/S.list.length*100);
  return '<div class="prow" style="'+accentStyle(c.t._m)+'">'
   +'<button class="xbtn" aria-label="Выйти из тренировки" title="Выйти" onclick="A.leave()">✕</button>'
   +'<div class="track"><i style="width:'+prog+'%"></i></div>'
   +'<span class="pcount">'+(S.idx+1)+'/'+S.list.length+'</span>'
   +'<span class="ptime" id="timer">'+fmtMs(S.deadline?Math.max(0,S.deadline-Date.now()):Date.now()-S.taskStart)+'</span>'
   +'</div>';
}
function viewPrac(){
  var c=cur();if(!c)return '';
  var q=c.q,m=c.t._m,h='';
  h+='<div class="wrap mid" style="'+accentStyle(m)+'"><div class="qwrap">';
  h+='<div class="qlabel">'+(q.kind==='open'?'Свободный ответ':q.kind==='mc'?'Выбери вариант':'Введи ответ')+'</div>';
  h+='<div class="qtext">'+esc(q.t)+'</div>';
  if(q.table)h+='<div class="tw">'+tableHtml(q.table)+'</div>';
  if(q.kind==='num'){
    h+='<div class="ansbox">'+(S.val?'<span class="v">'+esc(S.val)+'</span>':'<span class="ph">0</span>')
     +(q.unit?'<span class="u">'+esc(q.unit)+'</span>':'')+'</div>';
  } else if(q.kind==='mc'){
    h+='<div style="margin-top:18px">';
    q.opts.forEach(function(o,i){
      var cl='opt';
      if(S.answered){cl+=(i===q.correct?' good':(i===S.pick?' bad':' off'));}
      else if(S.pick===i)cl+=' sel';
      h+='<button class="'+cl+'" onclick="A.pick('+i+')"><span class="l">'
       +String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
  } else {
    if(!S.revealed){
      h+='<textarea class="ta" id="ans" placeholder="Структура, расчёт, рекомендация…" autocorrect="off" spellcheck="false">'+esc(S.val||'')+'</textarea>';
      h+='<div style="margin-top:12px"><button class="btn" style="--acc:var(--blue);--accl:var(--bluel);--on:#FFFFFF" '
       +'onclick="A.reveal()">Сравнить с эталоном</button></div>';
    } else {
      h+=refCard(c);
    }
  }
  if(!S.answered&&!S.revealed){
    if(S.badInput)h+='<div class="tip" style="margin-top:14px">Не разобрал число. Набери цифрами: <b>120000</b>, <b>1,5</b> или коротко <b>120k</b>.</div>';
    if(S.hint)h+='<div class="hintbox">'+esc(q.hint||(BANK.hints&&BANK.hints[q.id])||(k&&k.hint)||c.t.method[0])+'</div>';
    h+='<div class="linkrow">';
    if(!S.hint)h+='<button class="btn link" onclick="A.hint()">Подсказка</button>';
    if(q.kind!=='open')h+='<button class="btn link" onclick="A.dontKnow()">Не знаю</button>';
    h+='</div>';
  }
  if(S.answered)h+=solCard(c);
  h+='</div></div>';
  return h;
}
function refCard(c){
  var q=c.q,h='<div class="sol"><div class="hd"><span>Эталон</span><span class="ln"></span></div>';
  if(S.val)h+='<p class="sp" style="margin-bottom:10px"><b>Твой ответ:</b> '+esc(S.val)+'</p>';
  if(q.model&&q.model.length)h+='<ol>'+q.model.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.checklist&&q.checklist.length)h+='<div class="hd" style="margin-top:14px"><span>Проверь у себя</span><span class="ln"></span></div><ul>'
   +q.checklist.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(!S.ok)h+=mistakeCard(c);
  return h+'</div>';
}
function mistakeCard(c){
  var q=c.q,h='<div class="mistake"><div class="mt">Почему ответ не засчитан</div>';
  if(S.skipped){
    h+='<p><b>Ты пропустил задачу.</b> Это не ошибка характера: сейчас важнее увидеть решение, назвать приём вслух и вернуть задачу на повтор.</p>';
  }else if(q.kind==='num'){
    h+='<p>Ты ввёл <b>'+esc(S.user||'—')+'</b>, а правильный ориентир — <b>'+fmt(q.a)+(q.unit?' '+esc(q.unit):'')+'</b>.</p>';
  }else if(q.kind==='mc'){
    h+='<p>Ты выбрал <b>'+esc(S.user||'—')+'</b>. Правильный вариант — <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>.</p>';
  }else{
    h+='<p>Самооценка показала, что ход ответа нужно повторить. Сверь структуру с эталоном и назови один шаг, который пропустил.</p>';
  }
  if(q.trap)h+='<p><b>Типичная ловушка:</b> '+esc(q.trap)+'</p>';
  h+='</div>';
  return h;
}
function solCard(c){
  var q=c.q,h='<div class="sol"><div class="hd"><span>Решение</span><span class="ln"></span></div>';
  if(q.sol&&q.sol.length)h+='<ol>'+q.sol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.kind==='open'&&q.model&&q.model.length)h+='<ol>'+q.model.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(q.checklist&&q.checklist.length)h+='<div class="hd" style="margin-top:14px"><span>Проверь у себя</span><span class="ln"></span></div><ul>'
   +q.checklist.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(!S.ok)h+=mistakeCard(c);
  return h+'</div>';
}
function ansLine(c){
  var q=c.q;
  var right=fmt(q.a)+(q.unit?' '+esc(q.unit):'');
  if(S.skipped){
    if(q.kind==='num')return 'Верно: <b>'+right+'</b>';
    if(q.kind==='mc')return 'Верно: <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>';
    return 'Задача вернётся на повтор';
  }
  if(q.kind==='num')return S.ok?('Ответ: <b>'+right+'</b>'):('Твой: <b>'+esc(S.user||'—')+'</b> · верно <b>'+right+'</b>');
  if(q.kind==='mc')return 'Верно: <b>'+String.fromCharCode(65+q.correct)+'. '+esc(q.opts[q.correct])+'</b>';
  return 'Самооценка: '+(S.ok?'справился':'нужно повторить');
}
function footPrac(){
  var c=cur();if(!c)return '';
  var q=c.q;
  if(S.answered){
    var ok=S.ok, skip=!!S.skipped;
    var acc=skip?'var(--warn)':(ok?'var(--ok)':'var(--no)');
    var on=skip?(THEME==='light'?'#FFFFFF':'#131F24'):(ok?'var(--ongreen)':'#FFFFFF');
    return '<div class="fin" style="--acc:'+acc+';--on:'+on+'">'
     +'<div class="fbh"><div class="ic">'+(skip?'!':(ok?'✓':'✕'))+'</div>'
     +'<div class="tx"><div class="t">'+(skip?'Пропущено':(ok?'Верно':'Неверно'))+'</div><div class="a">'+ansLine(c)+'</div></div></div>'
     +'<button class="btn" style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.next()">'
     +(S.idx+1>=S.list.length?'Завершить':'Дальше')+'</button></div>';
  }
  if(q.kind==='num'){
    var keys=['1','2','3','4','5','6','7','8','9',',','0','del'];
    var kp='<div class="kp" style="'+accentStyle(c.t._m)+'">';
    keys.forEach(function(k){
      kp+='<button class="key'+(k==='del'?' del':'')+'" onclick="A.key(\''+k+'\')">'+(k==='del'?'⌫':k)+'</button>';
    });
    kp+='</div>';
    return '<div class="fin">'+kp+'<button class="btn"'+((S.val?'':' disabled'))
     +' style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.check()">Проверить</button></div>';
  }
  if(q.kind==='mc'){
    return '<div class="fin"><button class="btn"'+((S.pick===null||S.pick===undefined)?' disabled':'')
     +' style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.check()">Проверить</button></div>';
  }
  if(S.revealed){
    return '<div class="fin"><div class="btnrow">'
     +'<button class="btn sec" onclick="A.selfBad()">Повторить</button>'
     +'<button class="btn" style="--acc:var(--green);--accl:var(--greenl);--on:var(--ongreen)" onclick="A.selfGood()">Справился</button>'
     +'</div></div>';
  }
  return '';
}

/* ---------- summary ---------- */
function headSum(){return '<div class="hrow"><button class="xbtn" aria-label="Назад к главной" title="Назад" onclick="A.home()">‹</button>'
  +'<div class="ht">Итог</div></div>';}
function viewSum(){
  if(!S)return '';
  var done=S.done,ok=S.correct,pct=done?Math.round(ok/done*100):0;
  var col=pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--no)';
  var h='<div class="wrap"><div class="sum">';
  h+='<div class="ringwrap">'+ring(pct,col,164)+'<div class="ringtxt"><b>'+pct+'%</b><span>ВЕРНЫХ</span></div></div>';
  h+='<div class="sumline">'+ok+' из '+done+' · '+fmtMs((S.endedAt||Date.now())-S.startedAt)+'</div>';
  h+='<div class="stats" style="margin-top:0"><div><b>'+done+'</b><span>сделано</span></div>'
   +'<div><b class="'+(S.wrong.length?'r':'')+'">'+S.wrong.length+'</b><span>на повтор</span></div>'
   +'<div><b>'+todayN()+'</b><span>за сегодня</span></div></div>';
  h+='</div>';
  if(S.wrong.length){
    h+='<div class="sh">Разобрать заново</div><div class="wlist">';
    S.wrong.forEach(function(id){
      var q=null;ALLQ.forEach(function(x){if(x.id===id)q=x;});
      if(!q)return;
      var qt=q.t.length>56?q.t.slice(0,56)+'…':q.t;
      h+='<div class="wi" onclick="A.open(\''+q._t.id+'\')"><span class="wig">'+esc(q._t.num)+'</span>'
       +'<span class="wt">'+esc(qt)+'</span></div>';
    });
    h+='</div>';
    h+='<div style="margin-top:12px"><button class="btn" onclick="A.redoWrong()">Повторить ошибочные</button></div>';
  }
  h+='<div style="margin-top:10px"><button class="btn sec" onclick="A.home()">На главную</button></div>';
  return h+'</div>';
}

/* ---------- actions ---------- */
window.A={
  home:function(){screen='home';S=null;render();},
  open:function(id){typeId=id;screen='type';accTheory=false;S=null;render();},
  theory:function(){accTheory=!accTheory;if(accTheory&&typeId){ST.theory[typeId]=1;save();}render();},
  proto:function(){accProto=!accProto;render();},
  theme:function(){
    THEME=(THEME==='light')?'dark':'light';ST.theme=THEME;save();
    document.documentElement.setAttribute('data-theme',THEME);
    var mt=document.querySelector('meta[name=theme-color]');
    if(mt)mt.setAttribute('content',THEME==='light'?'#FFFFFF':'#131F24');
    render();
  },
  reset:function(){if(confirm('Сбросить весь прогресс?')){ST={q:{},theory:{},days:[],today:null,theme:THEME};save();render();}},
  start:function(id){var t=TBY[id];A.run(t.qs.map(function(q,i){return{tid:id,qi:i};}),'type');},
  startShuffle:function(id){var t=TBY[id];A.run(shuffle(t.qs.map(function(q,i){return{tid:id,qi:i};})),'type');},
  startBad:function(id){var t=TBY[id];
    A.run(t.qs.map(function(q,i){return{tid:id,qi:i};}).filter(function(x){return isBad(t.qs[x.qi]);}),'type');},
  jump:function(id,i){var t=TBY[id];A.run(t.qs.map(function(q,j){return{tid:id,qi:j};}),'type',i);},
  run:function(list,mode,startAt){
    if(!list.length)return;
    S={list:list,idx:startAt||0,mode:mode,answered:false,ok:null,user:'',pick:null,val:'',hint:false,revealed:false,
       skipped:false,badInput:false,done:0,correct:0,wrong:[],startedAt:Date.now(),taskStart:Date.now(),endedAt:null,
       deadline:(mode==='drill')?Date.now()+20*60*1000:null};
    screen='practice';render();
  },
  retry:function(){var b=badList();if(!b.length)return;
    A.run(shuffle(b.map(function(q){return{tid:q._t.id,qi:q._i};})),'type');},
  /* повтор по расписанию: сначала самые просроченные */
  review:function(){
    var d=dueList();
    if(!d.length)return;
    A.run(d.slice(0,20).map(function(q){return{tid:q._t.id,qi:q._i};}),'review');
  },
  redoWrong:function(){if(!S||!S.wrong.length)return;var l=[];
    S.wrong.forEach(function(id){ALLQ.forEach(function(q){if(q.id===id)l.push({tid:q._t.id,qi:q._i});});});
    A.run(l,'type');},
  drill:function(){
    /* Три очереди: к повтору сейчас, ни разу не решённые, остальные.
       Внутри очереди выбор взвешен по слабости темы, поэтому один тип
       может получить несколько слотов, а сильные темы почти не мешают. */
    var tiers=[[],[],[]];
    ALLQ.forEach(function(q){
      var s=ST.q[q.id];
      var tier=isDue(q)?0:(s?2:1);
      tiers[tier].push({q:q,w:typeWeight(q._t)});
    });
    var pick=[],cnt={},used={},CAP=3;
    function take(arr,limit){
      var pool=arr.slice();
      while(pick.length<limit&&pool.length){
        var total=0,i;
        for(i=0;i<pool.length;i++)total+=pool[i].w;
        var r=Math.random()*total,acc=0,idx=0;
        for(i=0;i<pool.length;i++){acc+=pool[i].w;if(acc>=r){idx=i;break;}}
        var c=pool.splice(idx,1)[0];
        var tid=c.q._t.id;
        if(used[c.q.id]||(cnt[tid]||0)>=CAP)continue;
        used[c.q.id]=1;pick.push(c.q);cnt[tid]=(cnt[tid]||0)+1;
      }
    }
    take(tiers[0],6);        /* не больше шести повторов, чтобы тренировка осталась миксом */
    take(tiers[1],DAILY);
    take(tiers[2],DAILY);
    if(pick.length<DAILY)take(tiers[0],DAILY);   /* всё слабое — добираем из очереди повтора */
    if(!pick.length)return;
    shuffle(pick);
    A.run(pick.map(function(q){return{tid:q._t.id,qi:q._i};}),'drill');
  },
  leave:function(){S=null;screen=typeId?'type':'home';render();},
  hint:function(){if(!S)return;var el=document.getElementById('ans');
    if(el&&el.value!==undefined)S.val=el.value;S.hint=true;render();},
  key:function(k){
    if(!S||S.answered)return;
    var v=S.val||'';
    if(k==='del')v=v.slice(0,-1);
    else if(k===','){if(v.indexOf(',')<0&&v.indexOf('.')<0)v=v+',';}
    else if(v.length<14)v=v+k;
    S.val=v;S.badInput=false;render();
  },
  pick:function(i){if(!S||S.answered)return;S.pick=(S.pick===i?null:i);render();},
  check:function(){
    var c=cur();if(!c||S.answered)return;
    if(c.q.kind==='num'){
      if(!S.val)return;
      var r=checkNum(c.q,S.val);
      if(r.invalid){S.badInput=true;render();return;}
      A.finish(!!r.ok,S.val);
    } else if(c.q.kind==='mc'){
      if(S.pick===null||S.pick===undefined)return;
      A.finish(S.pick===c.q.correct,String.fromCharCode(65+S.pick)+'. '+c.q.opts[S.pick]);
    }
  },
  /* «не знаю» — честный сигнал вместо угадывания: показываем решение, задача уходит в повтор */
  dontKnow:function(){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=false;S.user='';S.skipped=true;S.badInput=false;
    record(c.q,false,Date.now()-S.taskStart,true,false);
    S.done++;S.wrong.push(c.q.id);
    render();
  },
  reveal:function(){var el=document.getElementById('ans');if(el&&S)S.val=el.value;if(S)S.revealed=true;render();},
  selfGood:function(){A.finish(true,S.val);},
  selfBad:function(){A.finish(false,S.val);},
  finish:function(ok,user){
    var c=cur();if(!c||S.answered)return;
    S.answered=true;S.ok=ok;S.user=user||'';S.skipped=false;S.badInput=false;
    record(c.q,ok,Date.now()-S.taskStart,false,!S.hint);
    S.done++;if(ok)S.correct++;else S.wrong.push(c.q.id);
    render();
  },
  next:function(){
    if(!S)return;
    if(S.idx+1>=S.list.length){S.endedAt=Date.now();screen='summary';markDay();render();return;}
    S.idx++;S.answered=false;S.ok=null;S.user='';S.pick=null;S.val='';S.hint=false;S.revealed=false;
    S.skipped=false;S.badInput=false;S.taskStart=Date.now();
    render();
  }
};

document.addEventListener('keydown',function(e){
  if(screen!=='practice'||!S)return;
  var c=cur();if(!c)return;
  if(!S.answered&&c.q.kind==='num'&&/^[0-9]$/.test(e.key)){e.preventDefault();A.key(e.key);return;}
  if(!S.answered&&c.q.kind==='num'&&(e.key===','||e.key==='.')){e.preventDefault();A.key(',');return;}
  if(!S.answered&&c.q.kind==='num'&&e.key==='Backspace'){e.preventDefault();A.key('del');return;}
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(!S.answered)A.check(); else A.next();
});

setInterval(function(){
  if(screen!=='practice'||!S)return;
  var el=document.getElementById('timer');if(!el)return;
  var c=cur();if(!c)return;
  if(S.deadline){
    var left=S.deadline-Date.now();
    el.textContent=fmtMs(left);
    el.className='ptime'+(left<60000?' crit':left<300000?' over':'');
    if(left<=0){S.endedAt=Date.now();screen='summary';markDay();render();}
  } else {
    var t=Date.now()-S.taskStart;
    el.textContent=fmtMs(t);
    var target=(c.t.targetSec||90)*1000;
    el.className='ptime'+(t>target*2?' crit':t>target?' over':'');
  }
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});
}
render();
})();
</script>
